kjals", "det_comp": "Hvað þeir birta", "first_1b": "<b>Tvennt ólíkt er talið.</b> Heimild er leyfi, gefið út af ICANN, til að selja lén. Vefsvæði er vefur fyrirtækisins sjálfs, sá sem leyfið vísar á. Eitt fyrirtæki getur haft mörg leyfi, svo leyfin eru fleiri en fyrirtækin, ekki öfugt. Fjögur vefsvæði standa ein og sér að baki 2.270 af 3.322.", "first_web": "<b>Athugasemd: þetta er opna vefurinn, ekki myrki vefurinn.</b> Allt hér snýr að venjulegum vefsvæðum, þeim sem hafa nafn sem hægt er að slá inn, sem leitarvél finnur og hver sem er kemst á með venjulegum vafra. Nöfnin eru leigð, ekki í eigu: einhver greiðir skráningaraðila í þessari vísitölu fyrir réttinn til að nota nafn, oftast eitt ár í senn, og skráningaraðilinn getur tekið það til baka. Það er einmitt ástæða þess að þetta lag hefur nokkurt vald. Myrki vefurinn virkar öðruvísi. Vistföng hans eru ekki seld af neinum, ekkert fyrirtæki er til að skrifa til og enginn samningur til að vísa í, svo ekkert í þessari vísitölu nær þangað. Það er raunveruleg takmörkun á því sem hér er mælt, og jafnframt ástæða þess að opni vefurinn er þess virði að mæla: þar heldur auðkennanlegt fyrirtæki á nafninu, samningnum og skyldunni.", "l5_t": "Hversu hratt þeir bregðast við", "l5_q": "Þegar gild ábending hefur borist, hversu langan tíma tekur fjarlægingin í raun?", "l5_w": "Ekkert. Þetta lag er tómt, og sú fjarvera er það mikilvægasta á síðunni.", "l5_s": "Engin opinber heimild birtir viðbragðstíma á þessu stigi.", "l5_r": "Allt að ofan mælir hvað fyrirtæki segir. Þetta lag myndi mæla hvað það gerir. Án þess getur vísitalan enn ekki greint fyrirtæki sem hunsar ábendingar frá því sem er hægt en bregst við.", "l5_ask_h": "Hvað myndi fylla þetta lag", "l5_ask": "Þrennt, frá hverjum þeim sem sendir ábendingar í miklum mæli. Hvaða hýsingarfyrirtæki koma endurtekið fyrir. Hvaða skráningaraðilar koma endurtekið fyrir, þar með talin endurskráning eftir að efni er fjarlægt. Tími frá gildri ábendingu að fjarlægingu, eftir fyrirtækjum, í grófum bilum, með hugmynd um hversu margar ábendingar liggja að baki. Samantekið er í lagi. Eldra er í lagi. Gróft er í lagi.", "l5_cta": "Ef þið búið yfir einhverju af þessu, skrifið okkur", "l4_t": "Hvar skrárnar liggja", "l4_q": "Hvaða fyrirtæki hafa efnið í raun þegar nafn vísar þangað?", "l4_w": "Nefndir þjónustuaðilar með birtum fjarlægingartölum úr tveimur óháðum skýrslum. Það sem vantar er eitthvað nýlegt, og eitthvað á stigi skráningaraðila.", "l4_s": "Tvær birtar skýrslur: CSAM Hosting Monitor (TU Delft með EOKM) og Project Arachnid (C3P). Báðar nefna þjónustuaðila. Hvorug er nýleg, og hvorug nær til skráningaraðila.", "l4_r": "Skráningaraðili getur tekið nafn af, en skrárnar lifa af og birtast aftur undir nýju nafni. Án þessa lags fylgir vísitalan aðeins hálfri keðjunni.", "l4_ask_h": "Hvað myndi fylla þetta lag", "l4_ask": "Tvennt. Nýlegar tölur, því þær nýjustu birtu eru frá 2023 og Project Arachnid frá 2018 til 2020. Og skráningaraðilinn að baki hverju máli, sem tilkynningasamtök hafa í eigin gögnum en enginn hefur nokkru sinni tekið saman. Nöfn fyrirtækja, fjöldatölur og tímabil. Engir tenglar, ekkert efni, engar málsupplýsingar.", "l4_cta": "Ef þið búið yfir einhverju af þessu, skrifið okkur", "st_built": "Byggt á opinberum heimildum", "st_empty": "Ekki byggt enn", "st_h": "Staða", "l6_t": "Hversu oft það kemur aftur", "l6_q": "Eftir að eitthvað er fjarlægt, hversu oft birtist sami aðili aftur?", "l6_w": "Ekkert enn. Endurskráning eftir fjarlægingu sést í einstökum málum, en ekki sem hlutfall sem nokkur birtir.", "l6_s": "Kæmi frá endurteknum ábendingum hjá samtökum sem tilkynna sama efni oftar en einu sinni.", "l6_r": "Fjarlæging sem gengur til baka innan viku er engin fjarlæging. Endurtekningarhlutfall greinir eftirfylgni sem heldur frá eftirfylgni sem lítur bara þannig út.", "l6_ask_h": "Hvað myndi fylla þetta lag", "l6_ask": "Fyrir sama efni eða sama aðila: hversu oft það birtist aftur eftir fjarlægingu, yfir hvaða tímabil, og hvort það snýr aftur til sama hýsingarfyrirtækis eða sama skráningaraðila. Aðeins tölur og hlutföll, aldrei mál.", "l6_cta": "Ef þið búið yfir einhverju af þessu, skrifið okkur", "worst_h": "Hvar gatið er stærst", "col_reach": "Leyfi að baki", "worst_x": "Þeir aðilar sem ná lengst, og hvað hver þeirra hefur skrifað niður. Raðað eftir því hversu mörg leyfi standa að baki einu vefsvæði, því þar vegur ein ákvörðun þyngst.", "worst_note": "<b>Lestu þetta vandlega.</b> Þetta er ekki listi yfir verstu fyrirtækin, og ekki listi yfir fyrirtæki sem hýsa ofbeldisefni. Þetta er listi yfir stærstu aðilana sem sýnir hvað þeirra eigin skilmálar segja. Þrír þeir stærstu, sem samanlagt standa að baki 2.219 leyfum, nota aðeins almennt orðalag: ekkert í birtum skilmálum þeirra nefnir efni um kynferðislegt ofbeldi gegn börnum. Það er niðurstaða um skjöl þeirra. Hún segir ekkert um hvað er á netþjónum þeirra.", "l4_ex_h": "Raunverulegt dæmi um gatið", "l4_ex": "Við höfum sett saman eitt mál eingöngu úr opinberum beiningargögnum. Þrjú fyrirtæki sem öll koma fram sem aðilar í einu ESB-ríki, þar sem eitt þeirra er í reynd skráð utan þess. Vistfangarými þeirra færist á milli þeirra: svið fer frá fyrsta fyrirtækinu til annars, þriðja tekur rýmið yfir, og það fyrsta hættir alveg að auglýsa nokkrum vikum síðar. Opinber gögn sýna hreyfinguna. Þau geta ekki sýnt hvort einhver tilkynnti efnið, hversu langan tíma fjarlægingin tók, eða hvort sama efnið kom aftur á nýja sviðinu. Það eru einmitt gögnin sem við biðjum um. Við höfum nöfn fyrirtækjanna þriggja og birtum þau ekki, því skráning á færðu vistfangarými er ekki niðurstaða um efni, og enginn hefur fengið tækifæri til að svara.", "st_partial": "Að hluta byggt, úr birtum skýrslum", "pub_h": "Hvað hefur þegar verið birt", "ev_provider": "Þjónustuaðili", "ev_figure": "Hvað heimildin greinir frá", "ev_source": "Heimild", "ev_year": "Gögn frá", "l4_pub": "Þetta lag er ekki tómt, það er úrelt. Fjörutíu hýsingaraðilar eru nefndir með tölum í birtum skýrslum: CSAM Hosting Monitor frá TU Delft og EOKM, og Project Arachnid hjá Canadian Centre for Child Protection. Hver lína hér að neðan segir hvað heimildin greinir frá og tengir í hana.", "l5_pub": "Project Arachnid greinir frá miðgildi fjarlægingartíma upp á 24 klukkustundir frá ábendingu, þar sem hægustu 10% taka 42 daga eða meira, og að aðeins 25% fyrirtækja fjarlægðu efni innan sólarhrings 2020-21, niður úr 28% 2017-18. Í Hollandi var fjarlæging innan 24 klukkustunda 84% árið 2020 og 87% árið 2021, féll í 40% árið 2022 þegar frjálsa eftirlitið féll niður, og var um 59% árið 2024; lögbundin 12 klukkustunda fjarlægingarskylda hefur gilt frá júlí 2024. Allt á stigi þjónustuaðila eða landa. Ekkert á stigi skráningaraðila.", "l6_pub": "Project Arachnid greinir frá því að 48% tilkynntra mynda hafi áður verið merktar hjá sama þjónustuaðila, eina birta endurtekningarhlutfallið á þessu sviði. Þeir birta einnig hlutfall eftir þjónustuaðilum: 93,6% fyrir það hæsta sem mælst hefur, 93,5% fyrir það næsthæsta. Ekkert sambærilegt hefur nokkru sinni verið birt um skráningaraðila, og ekkert yfirhöfuð frá 2020."}};
const LANGS = ['en','da','nb','sv','fi','is'];
let L = 'en', DATA = null, shown = 60;

function t(k){ return (I18N[L] && I18N[L][k]) || I18N.en[k] || k; }
function nf(n){ return new Intl.NumberFormat(L === 'nb' ? 'nb-NO' : L).format(n); }

function buildLangs(){
  const el = document.getElementById('langs');
  el.innerHTML = LANGS.map(c =>
    `<button data-l="${c}" aria-pressed="${c===L}">${I18N[c].lang}</button>`).join('');
  el.querySelectorAll('button').forEach(b =>
    b.onclick = () => { setLang(b.dataset.l); });
}
function setLang(code){
  L = code;
  document.documentElement.lang = code === 'nb' ? 'no' : code;
  document.documentElement.dataset.lang = code;
  try { localStorage.setItem('rai_lang', code); } catch(e){}
  render();
}
function applyStrings(){
  document.querySelectorAll('[data-t]').forEach(n => n.innerHTML = t(n.dataset.t));
  document.querySelectorAll('[data-p]').forEach(n => n.placeholder = t(n.dataset.p));
  document.title = t('title') + ' · Custorian';
}

/* ---- layers ---- */
const LAYERS = ['l1','l2','l3','l4','l5','l6'];
const BUILT = {l1:'full',l2:'full',l3:'full',l4:'partial',l5:'partial',l6:'partial'};
let EV = null;
let activeLayer = 'l2';
function buildLayers(){
  document.getElementById('ltabs').innerHTML = LAYERS.map((k,i) =>
    `<button class="ltab" role="tab" data-k="${k}" aria-selected="${k===activeLayer}">
       <span class="num">0${i+1}</span><span class="st ${BUILT[k]==='full'?'sb':'sp'}">${BUILT[k]==='full'?t('st_built'):t('st_partial')}</span>
       <span class="t">${t(k+'_t')}</span><span class="q">${t(k+'_q')}</span>
     </button>`).join('');
  document.querySelectorAll('.ltab').forEach(b =>
    b.onclick = () => { activeLayer = b.dataset.k; buildLayers(); });
  const k = activeLayer;
  const ex = t(k+'_ex_h') !== k+'_ex_h'
    ? `<div class="example"><h4>${t(k+'_ex_h')}</h4><p>${t(k+'_ex')}</p></div>` : '';
  const pub = t(k+'_pub') !== k+'_pub'
    ? `<div class="pub"><h4>${t('pub_h')}</h4><p>${t(k+'_pub')}</p>${k==='l4'?evTable():''}</div>` : '';
  const ask = BUILT[k] !== 'full'
    ? `<div class="ask"><h4>${t(k+'_ask_h')}</h4><p>${t(k+'_ask')}</p>
       <a href="mailto:info@custorian.org?subject=Intermediary%20Accountability%20Index">${t(k+'_cta')} &rarr;</a></div>` : '';
  document.getElementById('lpanel').innerHTML =
    `<div class="lq">${t(k+'_q')}</div>
     <div class="lgrid">
       <div><h4>${t('lab_w')}</h4><p>${t(k+'_w')}</p></div>
       <div><h4>${t('lab_s')}</h4><p>${t(k+'_s')}</p></div>
       <div><h4>${t('lab_r')}</h4><p>${t(k+'_r')}</p></div>
     </div>${pub}${ex}${ask}`;
}

/* ---- grades ---- */
function buildGrades(){
  const rows = [['A','gA'],['B','gB'],['C','gC'],['D','gD'],['F','gF'],['—','gN']];
  document.getElementById('glist').innerHTML = rows.map(([g,k]) =>
    `<div class="g"><span class="pill p${g === '—' ? 'N' : g}">${g}</span><span class="d">${t(k)}</span></div>`).join('');
}

/* ---- table ---- */
function promise(s){
  if (s.c === 2) return ['p_named','pA'];
  if (s.c === 1) return ['p_child','pC'];
  if (s.c === 0) return ['p_catch','pD'];
  return ['p_unv','pN'];
}
function rows(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const g = document.getElementById('fg').value;
  const fc = document.getElementById('fc').checked;
  const fk = document.getElementById('fk').checked;
  return DATA.sites.filter(s => {
    if (q && !(s.h.toLowerCase().includes(q) || (s.n||[]).join(' ').toLowerCase().includes(q))) return false;
    if (g && s.d !== g) return false;
    if (fc && s.c !== 2) return false;
    if (fk && (s.g||1) < 2) return false;
    return true;
  });
}
function buildTable(){
  const all = rows(), list = all.slice(0, shown);
  document.getElementById('count').textContent = `${t('showing')} ${nf(list.length)} ${t('of')} ${nf(all.length)}`;
  document.getElementById('tb').innerHTML = list.map((s,i) => {
    const [pk,pc] = promise(s);
    const grade = s.d || '—';
    const sc = s.d ? `<div class="score"><span class="pill p${grade}">${grade}</span>
        <span class="bar"><i style="width:${s.s}%"></i></span>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${s.s}</span></div>`
      : `<span class="pill pN">${t('p_unv')}</span>`;
    return `<tr class="r" data-i="${i}">
      <td data-l="${t('col_site')}"><span class="host">${s.h}</span>${(s.g||1)>1?`<span class="badge">×${nf(s.g)}</span>`:''}
        <div class="co">${(s.n||[]).slice(0,2).join(' · ')}${(s.n||[]).length>2?' …':''}</div></td>
      <td data-l="${t('col_acc')}" style="font-family:var(--mono);font-size:13px">${nf(s.a)}</td>
      <td data-l="${t('col_prom')}"><span class="pill ${pc}">${t(pk)}</span></td>
      <td data-l="${t('col_score')}">${sc}</td></tr>`;
  }).join('');
  document.getElementById('more').style.display = all.length > shown ? '' : 'none';
  document.querySelectorAll('tr.r').forEach(tr => tr.onclick = () => toggle(tr, list[+tr.dataset.i]));
}
function toggle(tr, s){
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains('det')) { nx.remove(); return; }
  const d = document.createElement('tr');
  d.className = 'det';
  d.innerHTML = `<td colspan="4"><dl>
    ${s.q ? `<dt>${t('det_quote')}</dt><dd class="quote">&hellip;${s.q}&hellip;</dd>` : ''}
    ${s.u ? `<dt>${t('det_source')}</dt><dd><a href="${s.u}" target="_blank" rel="noopener">${s.u}</a></dd>` : ''}
    ${s.v ? `<dt>${t('det_doc')}</dt><dd>${s.v}</dd>` : ''}
    ${(s.k||[]).length ? `<dt>${t('det_comp')}</dt><dd>${s.k.join(' · ')}</dd>` : ''}
    <dt>${t('col_names')}</dt><dd>${(s.n||[]).join(' · ') || '—'}</dd></dl></td>`;
  tr.after(d);
}

function evTable(){
  if (!EV) return '';
  return `<div class="ev"><table class="evt"><thead><tr>
      <th>${t('ev_provider')}</th><th>${t('ev_figure')}</th><th>${t('ev_source')}</th><th>${t('ev_year')}</th>
    </tr></thead><tbody>` + EV.map(r => `<tr>
      <td data-l="${t('ev_provider')}"><b>${r.brand}</b>${r.recidivism?`<span class="badge">${r.recidivism}</span>`:''}</td>
      <td data-l="${t('ev_figure')}">${r.figure}</td>
      <td data-l="${t('ev_source')}"><a href="${r.url}" target="_blank" rel="noopener">${r.source}</a></td>
      <td data-l="${t('ev_year')}" style="font-family:var(--mono);font-size:12px;white-space:nowrap">${r.year}</td>
    </tr>`).join('') + '</tbody></table></div>';
}

function buildTop(){
  if (!DATA) return;
  const scored = DATA.sites.filter(s => s.d);
  const top = scored.sort((a,b) => (b.g||b.a||1) - (a.g||a.a||1)).slice(0, 6);
  document.getElementById('toplist').innerHTML = top.map((s, i) => {
    const [pk, pc] = promise(s);
    return `<div class="trow">
      <div><span class="rank">0${i+1}</span><span class="h">${s.h}</span>
        <div class="co">${(s.n||[]).slice(0,1)}</div></div>
      <div><span class="lab">${t('col_reach')}</span><span class="reach">${nf(s.g||s.a||1)}</span></div>
      <div><span class="lab">${t('col_prom')}</span><span class="pill ${pc}">${t(pk)}</span></div>
      <div><span class="lab">${t('col_score')}</span>
        <span class="pill p${s.d}">${s.d}</span>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px">${s.s}</span></div>
    </div>`;
  }).join('');
}

function render(){
  applyStrings(); buildLangs(); buildLayers(); buildGrades();
  const sel = document.getElementById('fg');
  const cur = sel.value;
  sel.innerHTML = `<option value="">${t('f_all')}</option>` + ['A','B','C','D','F'].map(g=>`<option value="${g}">${g}</option>`).join('');
  sel.value = cur;
  if (DATA) { buildTop(); buildTable(); }
}

fetch('hosting-evidence.json').then(r=>r.json()).then(e => { EV = e; buildLayers(); }).catch(()=>{});

fetch('registrar-index.json').then(r=>r.json()).then(d => {
  DATA = d;
  const S = d.summary;
  document.getElementById('n1').textContent = nf(S.accreditations);
  document.getElementById('n2').textContent = nf(S.websites);
  document.getElementById('n3').textContent = nf(S.l2.named);
  document.getElementById('n4').textContent = S.l3.median;
  document.getElementById('dret').textContent = S.retrieved;
  document.getElementById('dgen').textContent = S.generated;
  buildTop();
  buildTable();
});

['q','fg','fc','fk'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => { shown = 60; buildTable(); }));
document.getElementById('more').onclick = () => { shown += 60; buildTable(); };

try { const s = localStorage.getItem('rai_lang'); if (s && LANGS.includes(s)) L = s; } catch(e){}
render();
</script>
</body></html>
