<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Intermediary Accountability Index · Custorian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#0E0E10; --body:#3A3A40; --muted:#6E6E78;
  --violet:#5B41C2; --violet-l:#9B7CFF; --violet-wash:#F1EDFF;
  --rule:#E6E2DA; --rule-strong:#D5D0C6;
  --good:#1F6B4A; --good-bg:rgba(31,107,74,.10);
  --mid:#8A5A00;  --mid-bg:rgba(138,90,0,.10);
  --bad:#A32B2B;  --bad-bg:rgba(163,43,43,.09);
  --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --maxw:1120px; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E0E10; --card:#17171B; --ink:#F6F4EF; --body:#C9C6C0; --muted:#8E8E98;
  --violet:#9B7CFF; --violet-l:#B9A3FF; --violet-wash:#1E1A2E;
  --rule:#26262C; --rule-strong:#33333A;
  --good:#5FD3A0; --good-bg:rgba(95,211,160,.12);
  --mid:#E0A94E;  --mid-bg:rgba(224,169,78,.12);
  --bad:#FF8A8A;  --bad-bg:rgba(255,138,138,.12);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
h1,h2,h3{color:var(--ink);letter-spacing:-.02em;margin:0}
a{color:var(--violet);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:currentColor}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:4px}

/* top bar */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.03em;margin-right:auto}
.brand span{color:var(--violet)}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:5px 9px;border-radius:999px;border:1px solid var(--rule-strong);background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.langs button:hover{color:var(--ink);border-color:var(--violet-l)}
.langs button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}

/* hero */
.hero{padding:56px 0 34px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin-bottom:14px}
h1{font-size:clamp(30px,5.2vw,52px);font-weight:800;line-height:1.06;max-width:16ch}
.lede{font-size:clamp(16px,2.1vw,19px);line-height:1.55;max-width:62ch;margin-top:18px;color:var(--body)}
.review{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:7px 13px;border-radius:999px;background:var(--violet-wash);color:var(--violet);font-size:13px;font-weight:600}
.review::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--violet)}

/* generic section */
section{padding:34px 0}
.sec-h{font-size:clamp(20px,3vw,27px);font-weight:700;margin-bottom:6px}
.sec-x{color:var(--muted);max-width:66ch;margin-bottom:22px}

/* read first */
.first{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:24px;display:grid;gap:14px}
.first p{margin:0;max-width:78ch}
.first p b{color:var(--ink)}
.first p:last-child{padding-top:14px;border-top:1px solid var(--rule)}
.first p.webnote{padding:14px 16px;border:0;border-left:2px solid var(--violet-l);background:var(--violet-wash);border-radius:0 10px 10px 0;font-size:14.5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.stat .n{font-size:clamp(26px,3.6vw,36px);font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1}
.stat .l{font-weight:600;color:var(--ink);margin-top:8px;font-size:14px}
.stat .x{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}

/* biggest operators */
.toplist{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:1.6fr .7fr 1.2fr .9fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 16px}
.trow .rank{font-family:var(--mono);font-size:11px;color:var(--violet);margin-right:8px}
.trow .h{font-weight:600;color:var(--ink)}
.trow .co{font-size:12.5px;color:var(--muted);margin-top:1px}
.trow .reach{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:500}
.trow .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.topnote{margin-top:14px}
@media(max-width:780px){.trow{grid-template-columns:1fr 1fr;gap:10px}}

/* layers */
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ltab{flex:1 1 170px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;font-family:inherit}
.ltab:hover{border-color:var(--violet-l)}
.ltab[aria-selected="true"]{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}
.ltab{display:flex;flex-direction:column}
.ltab .num{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--violet)}
.ltab .st{display:inline-block;align-self:flex-start;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-top:6px}
.ltab .st.sb{color:var(--good);background:var(--good-bg)}
.ltab .st.se{color:var(--mid);background:var(--mid-bg)}
.ltab .t{display:block;font-weight:700;color:var(--ink);margin-top:4px;font-size:15px;letter-spacing:-.01em}
.ltab .q{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.lpanel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:26px}
.lpanel .lq{font-size:clamp(17px,2.3vw,21px);font-weight:700;color:var(--ink);max-width:44ch;line-height:1.3}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px}
.lgrid h4{margin:0 0 5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.lgrid p{margin:0;font-size:14.5px;line-height:1.55}
.ltab .st.sp{color:var(--violet);background:var(--violet-wash)}
.pub{margin-top:20px;padding:18px 20px;border-radius:12px;border:1px solid var(--rule-strong);background:var(--card)}
.pub h4{margin:0 0 6px;font-size:14.5px;color:var(--ink)}
.pub p{margin:0;font-size:14.5px}
.ev{margin-top:14px;max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:10px}
table.evt{border:0;border-radius:0}
table.evt th{position:sticky;top:0;background:var(--card);z-index:2}
table.evt td{font-size:13px;line-height:1.45}
table.evt td b{color:var(--ink)}
.example{margin-top:20px;padding:18px 20px;border-radius:12px;border:1px solid var(--rule-strong);background:color-mix(in srgb,var(--muted) 5%,transparent)}
.example h4{margin:0 0 6px;font-size:14.5px;color:var(--ink)}
.example p{margin:0;font-size:14.5px}
.ask{margin-top:16px;padding:20px;border-radius:12px;background:var(--violet-wash);border:1px solid color-mix(in srgb,var(--violet) 25%,transparent)}
.ask h4{margin:0 0 6px;font-size:15px;color:var(--ink)}
.ask p{margin:0;font-size:14.5px}
.ask a{display:inline-block;margin-top:12px;font-weight:600;border-bottom:1px solid currentColor}

/* grades */
.glist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 15px}
.pill{font-family:var(--mono);font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;flex:none}
.pA,.pB{color:var(--good);background:var(--good-bg)}
.pC{color:var(--mid);background:var(--mid-bg)}
.pD,.pF{color:var(--bad);background:var(--bad-bg)}
.pN{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.g span.d{font-size:13.5px;line-height:1.45}

/* table */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.controls input,.controls select{font-family:inherit;font-size:14px;padding:9px 13px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--card);color:var(--ink)}
.controls input{flex:1 1 260px}
.chk{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:0 0 auto;font-size:13.5px;color:var(--body);background:var(--card);border:1px solid var(--rule-strong);padding:9px 13px;border-radius:10px;cursor:pointer;user-select:none}
.chk:hover{border-color:var(--violet-l)}
.chk input{accent-color:var(--violet);margin:0}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule-strong);font-weight:500;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:top}
tr.r{cursor:pointer}
tr.r:hover td{background:color-mix(in srgb,var(--violet) 4%,transparent)}
.host{font-weight:600;color:var(--ink)}
.co{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:999px;background:var(--violet-wash);color:var(--violet);margin-left:6px;vertical-align:1px}
.score{display:flex;align-items:center;gap:9px}
.bar{width:64px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:99px;background:var(--violet)}
.det td{background:color-mix(in srgb,var(--violet) 3%,transparent);font-size:13.5px}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.det dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.det dd{margin:0}
.quote{border-left:2px solid var(--violet-l);padding-left:12px;color:var(--body);font-style:italic}
.more{display:block;margin:16px auto 0;font-family:inherit;font-size:14px;font-weight:600;color:var(--violet);background:var(--card);border:1px solid var(--rule-strong);padding:11px 22px;border-radius:10px;cursor:pointer}
.more:hover{border-color:var(--violet)}

/* method + footer */
.method{display:grid;gap:12px}
.method p{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:15px 18px;margin:0;font-size:14.5px}
.method p b{color:var(--ink)}
footer{border-top:1px solid var(--rule);margin-top:34px;padding:26px 0 56px;font-size:13px;color:var(--muted)}
.dates{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;margin-bottom:10px}
.dates b{color:var(--ink);font-weight:500}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .lgrid,.glist{grid-template-columns:1fr}
  .hero{padding:38px 0 26px}
}
@media(max-width:700px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.r{border-bottom:1px solid var(--rule);padding:6px 0}
  td{border:0;padding:5px 14px}
  td::before{content:attr(data-l);display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .count{margin-left:0}
}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">Custorian<span>.</span></div>
  <nav class="langs" id="langs" aria-label="Language"></nav>
</div></div>

<header class="hero"><div class="wrap">
  <div class="kicker" data-t="kicker"></div>
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="review" data-t="note_review"></div>
</div></header>

<main>
<section><div class="wrap">
  <h2 class="sec-h" data-t="first_h"></h2>
  <div class="first">
    <p data-t="first_1"></p>
    <p data-t="first_1b"></p>
    <p data-t="first_2"></p>
    <p data-t="first_3"></p>
    <p class="webnote" data-t="first_web"></p>
  </div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="stats_h"></h2>
  <div class="stats">
    <div class="stat"><div class="n" id="n1"></div><div class="l" data-t="s1"></div><div class="x" data-t="s1x"></div></div>
    <div class="stat"><div class="n" id="n2"></div><div class="l" data-t="s2"></div><div class="x" data-t="s2x"></div></div>
    <div class="stat"><div class="n" id="n3"></div><div class="l" data-t="s3"></div><div class="x" data-t="s3x"></div></div>
    <div class="stat"><div class="n" id="n4"></div><div class="l" data-t="s4"></div><div class="x" data-t="s4x"></div></div>
  </div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="worst_h"></h2>
  <p class="sec-x" data-t="worst_x"></p>
  <div class="toplist" id="toplist"></div>
  <p class="webnote topnote" data-t="worst_note"></p>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="layers_h"></h2>
  <p class="sec-x" data-t="layers_x"></p>
  <div class="ltabs" role="tablist" id="ltabs"></div>
  <div class="lpanel" id="lpanel" role="tabpanel"></div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="grades_h"></h2>
  <p class="sec-x" data-t="grades_x"></p>
  <div class="glist" id="glist"></div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="table_h"></h2>
  <div class="controls">
    <input id="q" type="search" data-p="search" aria-label="Search">
    <select id="fg"></select>
    <label class="chk"><input type="checkbox" id="fc"> <span data-t="f_csam"></span></label>
    <label class="chk"><input type="checkbox" id="fk"> <span data-t="f_clu"></span></label>
    <div class="count" id="count"></div>
  </div>
  <table><thead><tr>
    <th data-t="col_site"></th><th data-t="col_acc"></th><th data-t="col_prom"></th><th data-t="col_score"></th>
  </tr></thead><tbody id="tb"></tbody></table>
  <button class="more" id="more" data-t="more"></button>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="method_h"></h2>
  <div class="method">
    <p data-t="m1"></p><p data-t="m2"></p><p data-t="m3"></p><p data-t="m4"></p><p data-t="m5"></p>
  </div>
</div></section>
</main>

<footer><div class="wrap">
  <div class="dates">
    <span><span data-t="foot_ret"></span>: <b id="dret"></b></span>
    <span><span data-t="foot_gen"></span>: <b id="dgen"></b></span>
  </div>
  <div data-t="foot_lic"></div>
</div></footer>

<script>
const I18N = {"en": {"lang": "English", "kicker": "Foreningen Custorian · In review, not public", "title": "The Intermediary Accountability Index", "lede": "No harmful website stands alone. A company sold its name, another stores its files, and others carry its traffic. This index records what those companies have promised about child sexual abuse material, and how far that promise goes.", "first_h": "Read this first", "first_1": "<b>What is an intermediary?</b> Between a child and harmful material sit several companies. One sold the website's name, and is called a registrar. One stores the actual files, and is called a host. Others carry the traffic between them. None of them made the material, and all of them can act on it. This index measures them, starting with registrars, because that is where the public record is richest: there are 3,322 accreditations worldwide, and it is the layer almost nobody looks at.", "first_2": "<b>What this index says.</b> It records what a registrar has written down in its own public agreement, and what public enforcement records show. Nothing else.", "first_3": "<b>What this index never says.</b> It never claims a registrar hosts abuse material. That cannot be established at this level, so we do not assert it. A low grade means a company has not written something down. It is not an accusation.", "stats_h": "The picture in four numbers", "s1": "licences to sell domain names", "s1x": "ICANN accreditations. One company can hold many of them, so this is not a count of companies.", "s2": "distinct registrar websites", "s2x": "Each licence points at a company website, and many licences point at the same one. namebright.com alone sits behind 1,252 of them. So 3,322 licences resolve to roughly 1,007 operators, not more.", "s3": "name child sexual abuse material", "s3x": "Of the 446 agreements we could read, this many name it specifically.", "s4": "median transparency score", "s4x": "Out of 100. Half of all scored registrars fall below this.", "layers_h": "How the index is built, layer by layer", "layers_x": "Four layers, each answering a different question. Select one to read what it looks for and what it found.", "l1_t": "Who is behind it", "l1_q": "Are these separate companies, or one operation wearing many hats?", "l1_w": "We group accreditations that share a website. Four websites alone carry 2,270 of the 3,322 accreditations.", "l1_s": "ICANN's own public list of accredited registrars.", "l1_r": "A cluster is not wrongdoing. Resellers and acquisitions look identical from outside. It tells you where a single decision reaches furthest.", "l2_t": "What they promise", "l2_q": "Does the company's own agreement name child sexual abuse material at all?", "l2_w": "We read each registrar's published terms and record whether the words appear, whether only a catch-all like 'illegal content' appears, or whether nothing does.", "l2_s": "The registrar's own published agreement, retrieved and quoted.", "l2_r": "Naming it is not proof of action. Not naming it means a company has not committed in writing to the thing it would be judged on.", "l3_t": "What they show in public", "l3_q": "Beyond the contract, what does the company actually publish, and what has ICANN found?", "l3_w": "Two separate scores, never merged. One for what a registrar volunteers: an abuse contact, a route to a hotline, a stated commitment, named categories, a reference to EU rules. One for ICANN's formal record of breaches.", "l3_s": "Registrar disclosure pages, and ICANN's public compliance notices.", "l3_r": "A voluntary act and an imposed finding are different kinds of fact and carry different rights of reply, so they are kept apart.", "grades_h": "How to read a grade", "grades_x": "The grade is the transparency score in Layer 3, out of 100. It measures what a registrar publishes, nothing more.", "gA": "Publishes nearly everything we look for", "gB": "Publishes most of it", "gC": "Publishes some of it", "gD": "Publishes little", "gF": "Publishes almost none of it", "gN": "Not scored. We could not retrieve the agreement, so there is no finding either way. Never counted as zero.", "table_h": "The registrar layer in full", "search": "Search a company or website", "f_all": "All grades", "f_csam": "Names abuse material", "f_enf": "Has an enforcement notice", "f_clu": "In a shared-website cluster", "showing": "showing", "of": "of", "col_site": "Website", "col_names": "Companies", "col_acc": "Accreditations", "col_prom": "What the agreement names", "col_score": "Transparency", "col_enf": "ICANN notices", "p_named": "Names abuse material", "p_child": "Names child protection, not abuse material", "p_catch": "Catch-all wording only", "p_none": "Nothing on point", "p_unv": "Could not be read", "more": "Show more", "method_h": "Method, and what it cannot tell you", "m1": "<b>When the data is from.</b> Agreements were retrieved on one date and re-read monthly. Enforcement notices are re-pulled weekly. Both dates are shown below, because reading the older half as though it were the newer one would be a mistake.", "m2": "<b>Unverified is not zero.</b> If we could not retrieve a document, the registrar is not scored. A missing score is a gap in our reach, not a finding about the company.", "m3": "<b>Counting.</b> Figures are given per website or per domain, never per accreditation. One operator holding hundreds of accreditations would otherwise distort every percentage.", "m4": "<b>Matching enforcement notices.</b> ICANN identifies a registrar by number on recent notices and by company name on older ones. A name match alone is never enough: each is confirmed against the full legal name and labelled as inferred, with a link to the original letter.", "m5": "<b>Right of reply.</b> If a record here is wrong or out of date, write to us and we will correct it, and record that we did.", "foot_ret": "Agreements retrieved", "foot_gen": "Enforcement updated", "foot_lic": "Published under CC BY-ND 4.0. Figures are reproducible from the sources named above.", "note_review": "This page is in review and is not public.", "lab_w": "What it looks for", "lab_s": "Where it comes from", "lab_r": "How to read it", "det_quote": "What the agreement says", "det_source": "Source document", "det_doc": "Document date", "det_comp": "What it publishes", "first_1b": "<b>Two different things are being counted.</b> An accreditation is a licence, issued by ICANN, to sell domain names. A website is the company's own site, the one that licence points at. One company can hold many licences, so licences outnumber companies rather than the other way round. Four websites alone sit behind 2,270 of the 3,322.", "first_web": "<b>A note: this is the open web, not the dark web.</b> Everything here concerns ordinary websites, the kind with a name you can type, that a search engine can find, and that anyone reaches with a normal browser. Those names are rented, not owned: someone pays a registrar in this index for the right to use one, usually a year at a time, and the registrar can take it back. That is the whole reason this layer has any power. The dark web works differently. Its addresses are not sold by anyone, there is no company to write to and no contract to point at, so nothing in this index reaches it. That is a genuine limit on what is measured here, and it is also why the open web is worth measuring: it is the part where an identifiable company holds the name, the contract and the obligation.", "l5_t": "How fast they act", "l5_q": "Once a valid report is filed, how long does removal actually take?", "l5_w": "Nothing. This layer is empty, and that absence is the most important thing on this page.", "l5_s": "No public source reports removal time at this level.", "l5_r": "Everything above measures what a company says. This layer would measure what it does. Without it, the index cannot yet tell a company that ignores reports from one that is slow but acts.", "l5_ask_h": "What would fill this layer", "l5_ask": "Three things, from anyone who files reports at scale. Which hosting companies recur. Which registrars recur, including re-registration after a takedown. Time from a valid report to removal, per company, in rough bands, with a sense of how many reports sit behind each. Aggregated is fine. Historical is fine. Coarse is fine.", "l5_cta": "If you hold any of this, write to us", "l4_t": "Where the files sit", "l4_q": "Which companies actually hold the material once a name points at it?", "l4_w": "Named providers with published removal figures, drawn from two independent reports. What is missing is anything current, and anything at the registrar layer.", "l4_s": "Two published reports: the CSAM Hosting Monitor (TU Delft with EOKM) and Project Arachnid (C3P). Both name providers. Neither is current, and neither covers registrars.", "l4_r": "A registrar can take a name away, but the files survive and come back under a new name. Without this layer the index follows only half the chain.", "l4_ask_h": "What would fill this layer", "l4_ask": "Two things. Current figures, because the newest published numbers are from 2023 and Project Arachnid's are from 2018 to 2020. And the registrar behind each case, which reporting organisations hold in their own records but nobody has ever aggregated. Company names, counts and time bands. No links, no material, no case detail.", "l4_cta": "If you hold any of this, write to us", "st_built": "Built from public sources", "st_empty": "Not yet built", "st_h": "Status", "l6_t": "How often it comes back", "l6_q": "After something is removed, how often does the same operator reappear?", "l6_w": "Nothing yet. Re-registration after a takedown is visible in individual cases, but not at a rate anyone publishes.", "l6_s": "Would come from repeat-report data held by organisations that report the same material more than once.", "l6_r": "A takedown undone within a week is not a takedown. A recidivism rate is what separates enforcement that holds from enforcement that only looks like it.", "l6_ask_h": "What would fill this layer", "l6_ask": "For the same material or the same operator: how often it reappears after removal, over what interval, and whether it returns to the same hosting company or the same registrar. Counts and rates only, never cases.", "l6_cta": "If you hold any of this, write to us", "worst_h": "Where the gap is widest", "col_reach": "Licences behind it", "worst_x": "The operators that reach furthest, and what each of them has written down. Ranked by how many licences sit behind a single website, because that is where one decision carries the most weight.", "worst_note": "<b>Read this carefully.</b> This is not a list of the worst companies, and it is not a list of companies hosting abuse material. It is a list of the largest operators, showing what their own agreements say. The three largest, between them behind 2,219 licences, use catch-all wording only: nothing in their published terms names child sexual abuse material. That is a finding about their documents. It says nothing about what is on their servers.", "l4_ex_h": "A worked example of the gap", "l4_ex": "We have reconstructed one case from public routing records alone. Three companies, all presenting as operators in a single EU member state, one of them actually incorporated offshore. Their address space moves between them: a range leaves the first company for a second, a third takes up the space, and the first stops announcing anything at all a few weeks later. Public records show the movement. They cannot show whether anyone reported the content, how long removal took, or whether the same material came back in the new range. That is precisely the data we are asking for. We hold the three company names and are not publishing them, because a record of address space moving is not a finding about content, and nobody has had a right of reply.", "st_partial": "Partly built, from published reports", "pub_h": "What is already published", "ev_provider": "Provider", "ev_figure": "What the source reports", "ev_source": "Source", "ev_year": "Data from", "l4_pub": "This layer is not empty, it is out of date. Forty hosting providers are named with figures in published reports: the CSAM Hosting Monitor run by TU Delft with EOKM, and Project Arachnid at the Canadian Centre for Child Protection. Every row below states what the source reports, and links to it.", "l5_pub": "Project Arachnid reports a median removal time of 24 hours from notice, with the slowest 10% taking 42 days or more, and finds that only 25% of companies removed material within one day in 2020-21, down from 28% in 2017-18. In the Netherlands, removal within 24 hours ran at 84% in 2020 and 87% in 2021, fell to 40% in 2022 when the voluntary monitor lapsed, and was around 59% in 2024; a statutory 12-hour removal order has applied since July 2024. All of it is at provider or country level. None of it is at registrar level.", "l6_pub": "Project Arachnid reports that 48% of noticed images had previously been flagged to the same provider, the only published recidivism figure in this field. It also publishes a rate per provider: 93.6% for the highest measured, 93.5% for the second. Nothing equivalent has ever been published for registrars, and nothing at all has been published since 2020."}, "da": {"lang": "Dansk", "kicker": "Foreningen Custorian · Under gennemgang, ikke offentlig", "title": "Indekset over mellemleds ansvarlighed", "lede": "Intet skadeligt websted står alene. Ét firma har solgt navnet, et andet opbevarer filerne, og andre transporterer trafikken. Dette indeks viser, hvad de firmaer har lovet om materiale med seksuelt misbrug af børn, og hvor langt det løfte rækker.", "first_h": "Læs dette først", "first_1": "<b>Hvad er et mellemled?</b> Mellem et barn og skadeligt materiale sidder flere firmaer. Ét har solgt webstedets navn og kaldes en registrator. Ét opbevarer selve filerne og kaldes en hostingudbyder. Andre transporterer trafikken imellem dem. Ingen af dem har lavet materialet, og alle kan de handle på det. Dette indeks måler dem, med registratorer først, fordi det er der, den offentlige dokumentation er rigest: der findes 3.322 godkendelser globalt, og det er det led, næsten ingen ser på.", "first_2": "<b>Hvad indekset siger.</b> Det viser, hvad en registrator selv har skrevet i sine offentlige vilkår, og hvad offentlige tilsynssager viser. Intet andet.", "first_3": "<b>Hvad indekset aldrig siger.</b> Det påstår aldrig, at en registrator hoster misbrugsmateriale. Det kan ikke fastslås på dette niveau, så vi hævder det ikke. En lav karakter betyder, at et firma ikke har skrevet noget ned. Det er ikke en anklage.", "stats_h": "Billedet i fire tal", "s1": "licenser til at sælge domænenavne", "s1x": "ICANN-godkendelser. Ét firma kan have mange af dem, så dette er ikke et antal firmaer.", "s2": "selvstændige registrator-websteder", "s2x": "Hver licens peger på et firmawebsted, og mange licenser peger på det samme. Alene namebright.com ligger bag 1.252 af dem. Så 3.322 licenser bliver til omkring 1.007 aktører, ikke flere.", "s3": "nævner materiale med seksuelt misbrug af børn", "s3x": "Af de 446 vilkår, vi kunne læse, nævner så mange det udtrykkeligt.", "s4": "median for gennemsigtighed", "s4x": "Ud af 100. Halvdelen af de vurderede registratorer ligger under dette.", "layers_h": "Sådan er indekset bygget op, lag for lag", "layers_x": "Fire lag, der hver svarer på sit spørgsmål. Vælg et for at læse, hvad det ser efter, og hvad det fandt.", "l1_t": "Hvem står bag", "l1_q": "Er det selvstændige firmaer, eller én aktør med mange navne?", "l1_w": "Vi grupperer godkendelser, der deler websted. Fire websteder alene bærer 2.270 af de 3.322 godkendelser.", "l1_s": "ICANN's egen offentlige liste over godkendte registratorer.", "l1_r": "En klynge er ikke i sig selv kritisabel. Forhandlere og opkøb ser ens ud udefra. Det viser, hvor én beslutning rækker længst.", "l2_t": "Hvad de lover", "l2_q": "Nævner firmaets egne vilkår overhovedet materiale med seksuelt misbrug af børn?", "l2_w": "Vi læser hver registrators offentliggjorte vilkår og noterer, om ordene står der, om der kun står en generel formulering som ulovligt indhold, eller om der intet står.", "l2_s": "Registratorens egne offentliggjorte vilkår, hentet og citeret.", "l2_r": "At nævne det er ikke bevis for handling. Ikke at nævne det betyder, at firmaet ikke skriftligt har forpligtet sig på netop det, det ville blive bedømt på.", "l3_t": "Hvad de viser offentligt", "l3_q": "Ud over kontrakten: hvad offentliggør firmaet reelt, og hvad har ICANN fundet?", "l3_w": "To adskilte scorer, aldrig lagt sammen. Én for det, en registrator frivilligt oplyser: en kontaktadresse for misbrug, en vej til en hotline, en erklæret forpligtelse, navngivne kategorier, en henvisning til EU-regler. Én for ICANN's formelle sager om brud.", "l3_s": "Registratorernes egne oplysningssider og ICANN's offentlige tilsynsbreve.", "l3_r": "En frivillig handling og en pålagt afgørelse er forskellige slags fakta med forskellig ret til at svare, så de holdes adskilt.", "grades_h": "Sådan læses en karakter", "grades_x": "Karakteren er gennemsigtighedsscoren i lag 3, ud af 100. Den måler, hvad en registrator offentliggør, ikke andet.", "gA": "Offentliggør næsten alt, vi ser efter", "gB": "Offentliggør det meste", "gC": "Offentliggør noget af det", "gD": "Offentliggør lidt", "gF": "Offentliggør næsten intet", "gN": "Ikke vurderet. Vi kunne ikke hente vilkårene, så der er ingen konklusion nogen vej. Tælles aldrig som nul.", "table_h": "Registratorleddet i sin helhed", "search": "Søg efter firma eller websted", "f_all": "Alle karakterer", "f_csam": "Nævner misbrugsmateriale", "f_enf": "Har en tilsynssag", "f_clu": "I en delt websteds-klynge", "showing": "viser", "of": "af", "col_site": "Websted", "col_names": "Firmaer", "col_acc": "Godkendelser", "col_prom": "Hvad vilkårene nævner", "col_score": "Gennemsigtighed", "col_enf": "ICANN-sager", "p_named": "Nævner misbrugsmateriale", "p_child": "Nævner børnebeskyttelse, ikke misbrugsmateriale", "p_catch": "Kun generel formulering", "p_none": "Intet relevant", "p_unv": "Kunne ikke læses", "more": "Vis flere", "method_h": "Metode, og hvad den ikke kan fortælle", "m1": "<b>Hvornår data er fra.</b> Vilkår blev hentet på én dato og genlæses månedligt. Tilsynssager hentes ugentligt. Begge datoer står nedenfor, fordi det ville være en fejl at læse den ældre halvdel som var den ny.", "m2": "<b>Uverificeret er ikke nul.</b> Kunne vi ikke hente et dokument, vurderes registratoren ikke. En manglende score er et hul i vores rækkevidde, ikke en konklusion om firmaet.", "m3": "<b>Optælling.</b> Tal opgøres pr. websted eller pr. domæne, aldrig pr. godkendelse. Én aktør med hundredvis af godkendelser ville ellers forvride enhver procent.", "m4": "<b>Kobling af tilsynssager.</b> ICANN angiver en registrator med nummer i nyere breve og med firmanavn i ældre. Et navnesammenfald alene er aldrig nok: hvert enkelt bekræftes mod det fulde juridiske navn og markeres som udledt, med link til det oprindelige brev.", "m5": "<b>Ret til at svare.</b> Er en oplysning her forkert eller forældet, så skriv til os. Vi retter den og noterer, at vi gjorde det.", "foot_ret": "Vilkår hentet", "foot_gen": "Tilsynssager opdateret", "foot_lic": "Udgivet under CC BY-ND 4.0. Tallene kan genskabes fra de nævnte kilder.", "note_review": "Denne side er under gennemgang og er ikke offentlig.", "lab_w": "Hvad det ser efter", "lab_s": "Hvor det kommer fra", "lab_r": "Sådan læses det", "det_quote": "Hvad vilkårene siger", "det_source": "Kildedokument", "det_doc": "Dokumentets dato", "det_comp": "Hvad de offentliggør", "first_1b": "<b>Der tælles to forskellige ting.</b> En godkendelse er en licens, udstedt af ICANN, til at sælge domænenavne. Et websted er firmaets eget site, det som licensen peger på. Ét firma kan have mange licenser, så licenser er flere end firmaer, ikke omvendt. Alene fire websteder ligger bag 2.270 af de 3.322.", "first_web": "<b>En note: det her er det åbne net, ikke det mørke net.</b> Alt her handler om almindelige websteder, dem med et navn man kan taste, som en søgemaskine kan finde, og som enhver når med en almindelig browser. De navne lejes, de ejes ikke: nogen betaler en registrator i dette indeks for retten til at bruge et navn, typisk et år ad gangen, og registratoren kan tage det tilbage. Det er hele grunden til, at dette led overhovedet har magt. Det mørke net fungerer anderledes. Dets adresser sælges ikke af nogen, der er intet firma at skrive til og ingen kontrakt at pege på, så intet i dette indeks når derind. Det er en reel begrænsning ved det, der måles her, og det er også derfor det åbne net er værd at måle: det er den del, hvor et identificerbart firma har navnet, kontrakten og forpligtelsen.", "l5_t": "Hvor hurtigt de handler", "l5_q": "Når en gyldig anmeldelse er indgivet, hvor lang tid tager fjernelsen så reelt?", "l5_w": "Intet. Dette lag er tomt, og det fravær er det vigtigste på siden.", "l5_s": "Ingen offentlig kilde oplyser fjernelsestid på dette niveau.", "l5_r": "Alt ovenfor måler, hvad et firma siger. Dette lag ville måle, hvad det gør. Uden det kan indekset endnu ikke skelne et firma, der ignorerer anmeldelser, fra et, der er langsomt men handler.", "l5_ask_h": "Hvad der ville udfylde dette lag", "l5_ask": "Tre ting, fra enhver der anmelder i stort omfang. Hvilke hostingfirmaer går igen. Hvilke registratorer går igen, herunder ny registrering efter en nedtagning. Tid fra gyldig anmeldelse til fjernelse, pr. firma, i grove intervaller, med en fornemmelse af hvor mange anmeldelser der ligger bag. Samlet er fint. Historisk er fint. Groft er fint.", "l5_cta": "Har I noget af dette, så skriv til os", "l4_t": "Hvor filerne ligger", "l4_q": "Hvilke firmaer har reelt materialet, når først et navn peger derhen?", "l4_w": "Navngivne udbydere med offentliggjorte fjernelsestal fra to uafhængige rapporter. Det, der mangler, er noget aktuelt, og noget på registratorleddet.", "l4_s": "To offentliggjorte rapporter: CSAM Hosting Monitor (TU Delft med EOKM) og Project Arachnid (C3P). Begge navngiver udbydere. Ingen af dem er aktuelle, og ingen af dem dækker registratorer.", "l4_r": "En registrator kan tage et navn væk, men filerne overlever og dukker op igen under et nyt navn. Uden dette lag følger indekset kun halvdelen af kæden.", "l4_ask_h": "Hvad der ville udfylde dette lag", "l4_ask": "To ting. Aktuelle tal, fordi de nyeste offentliggjorte er fra 2023 og Project Arachnids fra 2018 til 2020. Og registratoren bag hver sag, som anmeldende organisationer har i deres egne registre, men som ingen nogensinde har samlet. Firmanavne, antal og tidsintervaller. Ingen links, intet materiale, ingen sagsdetaljer.", "l4_cta": "Har I noget af dette, så skriv til os", "st_built": "Bygget på offentlige kilder", "st_empty": "Ikke bygget endnu", "st_h": "Status", "l6_t": "Hvor ofte det kommer igen", "l6_q": "Efter en fjernelse, hvor ofte dukker den samme aktør op igen?", "l6_w": "Intet endnu. Ny registrering efter en nedtagning ses i enkeltsager, men ikke som en rate nogen offentliggør.", "l6_s": "Ville komme fra gentagne anmeldelser hos organisationer, der anmelder det samme materiale mere end én gang.", "l6_r": "En nedtagning, der er omgjort inden for en uge, er ikke en nedtagning. En recidivrate er det, der skiller håndhævelse der holder fra håndhævelse der blot ser sådan ud.", "l6_ask_h": "Hvad der ville udfylde dette lag", "l6_ask": "For det samme materiale eller den samme aktør: hvor ofte det dukker op igen efter fjernelse, over hvilket interval, og om det vender tilbage til det samme hostingfirma eller den samme registrator. Kun tal og rater, aldrig sager.", "l6_cta": "Har I noget af dette, så skriv til os", "worst_h": "Hvor hullet er størst", "col_reach": "Licenser bag det", "worst_x": "De aktører, der rækker længst, og hvad hver af dem har skrevet ned. Rangeret efter hvor mange licenser der ligger bag ét websted, fordi det er der, én beslutning vejer tungest.", "worst_note": "<b>Læs dette omhyggeligt.</b> Dette er ikke en liste over de værste firmaer, og det er ikke en liste over firmaer, der hoster misbrugsmateriale. Det er en liste over de største aktører, der viser, hvad deres egne vilkår siger. De tre største, der tilsammen ligger bag 2.219 licenser, bruger kun generelle formuleringer: intet i deres offentliggjorte vilkår nævner materiale med seksuelt misbrug af børn. Det er en konstatering om deres dokumenter. Det siger intet om, hvad der ligger på deres servere.", "l4_ex_h": "Et konkret eksempel på hullet", "l4_ex": "Vi har rekonstrueret én sag alene ud fra offentlige routingdata. Tre firmaer, der alle fremstår som aktører i ét EU-land, hvoraf det ene reelt er registreret offshore. Deres adresserum flytter mellem dem: et interval forlader det første firma til fordel for det andet, et tredje overtager pladsen, og det første holder helt op med at annoncere få uger senere. Offentlige data viser bevægelsen. De kan ikke vise, om nogen anmeldte indholdet, hvor lang tid fjernelsen tog, eller om det samme materiale kom igen i det nye interval. Det er præcis de data, vi beder om. Vi har de tre firmanavne og offentliggør dem ikke, for en registrering af flyttet adresserum er ikke en konstatering om indhold, og ingen har haft ret til at svare.", "st_partial": "Delvist bygget, fra offentliggjorte rapporter", "pub_h": "Hvad der allerede er offentliggjort", "ev_provider": "Udbyder", "ev_figure": "Hvad kilden rapporterer", "ev_source": "Kilde", "ev_year": "Data fra", "l4_pub": "Dette lag er ikke tomt, det er forældet. Fyrre hostingudbydere er navngivet med tal i offentliggjorte rapporter: CSAM Hosting Monitor fra TU Delft og EOKM, samt Project Arachnid hos Canadian Centre for Child Protection. Hver række nedenfor gengiver, hvad kilden rapporterer, og linker til den.", "l5_pub": "Project Arachnid angiver en median fjernelsestid på 24 timer efter anmeldelse, hvor de langsomste 10% tager 42 dage eller mere, og finder at kun 25% af firmaerne fjernede materiale inden for én dag i 2020-21, ned fra 28% i 2017-18. I Nederlandene lå fjernelse inden for 24 timer på 84% i 2020 og 87% i 2021, faldt til 40% i 2022 da den frivillige overvågning ophørte, og var omkring 59% i 2024; et lovbestemt påbud om fjernelse inden 12 timer har gjaldt siden juli 2024. Alt sammen på udbyder- eller landeniveau. Intet på registratorniveau.", "l6_pub": "Project Arachnid angiver, at 48% af de anmeldte billeder tidligere var markeret over for den samme udbyder, det eneste offentliggjorte recidivtal på området. De offentliggør også en rate pr. udbyder: 93,6% for den højeste målte, 93,5% for den næsthøjeste. Intet tilsvarende er nogensinde offentliggjort for registratorer, og intet overhovedet siden 2020."}, "nb": {"lang": "Norsk", "kicker": "Foreningen Custorian · Under vurdering, ikke offentlig", "title": "Indeksen over mellomledds ansvarlighet", "lede": "Ingen skadelig nettside står alene. Ett selskap solgte navnet, et annet lagrer filene, og andre frakter trafikken. Denne indeksen viser hva de selskapene har lovet om materiale som viser seksuelle overgrep mot barn, og hvor langt det løftet rekker.", "first_h": "Les dette først", "first_1": "<b>Hva er et mellomledd?</b> Mellom et barn og skadelig materiale sitter flere selskaper. Ett solgte nettstedets navn og kalles en registrar. Ett lagrer selve filene og kalles en hostingleverandør. Andre frakter trafikken mellom dem. Ingen av dem laget materialet, og alle kan handle på det. Denne indeksen måler dem, med registrarer først, fordi det er der den offentlige dokumentasjonen er rikest: det finnes 3 322 godkjenninger globalt, og dette er leddet nesten ingen ser på.", "first_2": "<b>Hva indeksen sier.</b> Den viser hva en registrar selv har skrevet i sine offentlige vilkår, og hva offentlige tilsynssaker viser. Ingenting annet.", "first_3": "<b>Hva indeksen aldri sier.</b> Den påstår aldri at en registrar lagrer overgrepsmateriale. Det kan ikke fastslås på dette nivået, så vi hevder det ikke. En lav karakter betyr at et selskap ikke har skrevet noe ned. Det er ingen anklage.", "stats_h": "Bildet i fire tall", "s1": "lisenser til å selge domenenavn", "s1x": "ICANN-godkjenninger. Ett selskap kan ha mange av dem, så dette er ikke et antall selskaper.", "s2": "selvstendige registrar-nettsteder", "s2x": "Hver lisens peker på et selskapsnettsted, og mange lisenser peker på det samme. Alene namebright.com ligger bak 1 252 av dem. Så 3 322 lisenser blir til rundt 1 007 aktører, ikke flere.", "s3": "nevner materiale om seksuelle overgrep mot barn", "s3x": "Av de 446 vilkårene vi kunne lese, nevner så mange det uttrykkelig.", "s4": "median for åpenhet", "s4x": "Av 100. Halvparten av de vurderte registrarene ligger under dette.", "layers_h": "Slik er indeksen bygget opp, lag for lag", "layers_x": "Fire lag som hver svarer på sitt spørsmål. Velg ett for å lese hva det ser etter, og hva det fant.", "l1_t": "Hvem står bak", "l1_q": "Er dette selvstendige selskaper, eller én aktør med mange navn?", "l1_w": "Vi grupperer godkjenninger som deler nettsted. Fire nettsteder alene bærer 2 270 av de 3 322 godkjenningene.", "l1_s": "ICANNs egen offentlige liste over godkjente registrarer.", "l1_r": "En klynge er ikke i seg selv kritikkverdig. Forhandlere og oppkjøp ser like ut utenfra. Det viser hvor én beslutning rekker lengst.", "l2_t": "Hva de lover", "l2_q": "Nevner selskapets egne vilkår i det hele tatt materiale om seksuelle overgrep mot barn?", "l2_w": "Vi leser hver registrars publiserte vilkår og noterer om ordene står der, om det bare står en generell formulering som ulovlig innhold, eller om det ikke står noe.", "l2_s": "Registrarens egne publiserte vilkår, hentet og sitert.", "l2_r": "Å nevne det er ikke bevis på handling. Å ikke nevne det betyr at selskapet ikke skriftlig har forpliktet seg på nettopp det det ville bli vurdert på.", "l3_t": "Hva de viser offentlig", "l3_q": "Utover kontrakten: hva publiserer selskapet faktisk, og hva har ICANN funnet?", "l3_w": "To adskilte poengsummer, aldri slått sammen. Én for det en registrar frivillig oppgir: en kontaktadresse for misbruk, en vei til en hjelpelinje, en uttalt forpliktelse, navngitte kategorier, en henvisning til EU-regler. Én for ICANNs formelle saker om brudd.", "l3_s": "Registrarenes egne informasjonssider og ICANNs offentlige tilsynsbrev.", "l3_r": "En frivillig handling og en pålagt avgjørelse er ulike slags fakta med ulik rett til å svare, så de holdes adskilt.", "grades_h": "Slik leser du en karakter", "grades_x": "Karakteren er åpenhetsscoren i lag 3, av 100. Den måler hva en registrar publiserer, ikke noe mer.", "gA": "Publiserer nesten alt vi ser etter", "gB": "Publiserer det meste", "gC": "Publiserer noe av det", "gD": "Publiserer lite", "gF": "Publiserer nesten ingenting", "gN": "Ikke vurdert. Vi fikk ikke hentet vilkårene, så det finnes ingen konklusjon noen vei. Telles aldri som null.", "table_h": "Registrarleddet i sin helhet", "search": "Søk etter selskap eller nettsted", "f_all": "Alle karakterer", "f_csam": "Nevner overgrepsmateriale", "f_enf": "Har en tilsynssak", "f_clu": "I en delt nettsted-klynge", "showing": "viser", "of": "av", "col_site": "Nettsted", "col_names": "Selskaper", "col_acc": "Godkjenninger", "col_prom": "Hva vilkårene nevner", "col_score": "Åpenhet", "col_enf": "ICANN-saker", "p_named": "Nevner overgrepsmateriale", "p_child": "Nevner barnevern, ikke overgrepsmateriale", "p_catch": "Bare generell formulering", "p_none": "Ingenting relevant", "p_unv": "Kunne ikke leses", "more": "Vis flere", "method_h": "Metode, og hva den ikke kan fortelle", "m1": "<b>Når dataene er fra.</b> Vilkårene ble hentet på én dato og leses på nytt månedlig. Tilsynssaker hentes ukentlig. Begge datoene står nedenfor, fordi det ville være feil å lese den eldre halvdelen som om den var den nye.", "m2": "<b>Uverifisert er ikke null.</b> Fikk vi ikke hentet et dokument, vurderes ikke registraren. En manglende score er et hull i vår rekkevidde, ikke en konklusjon om selskapet.", "m3": "<b>Telling.</b> Tall oppgis per nettsted eller per domene, aldri per godkjenning. Én aktør med hundrevis av godkjenninger ville ellers forvrenge enhver prosent.", "m4": "<b>Kobling av tilsynssaker.</b> ICANN oppgir en registrar med nummer i nyere brev og med selskapsnavn i eldre. Et navnetreff alene er aldri nok: hvert enkelt bekreftes mot det fulle juridiske navnet og merkes som utledet, med lenke til det opprinnelige brevet.", "m5": "<b>Rett til å svare.</b> Er en opplysning her feil eller utdatert, så skriv til oss. Vi retter den, og noterer at vi gjorde det.", "foot_ret": "Vilkår hentet", "foot_gen": "Tilsynssaker oppdatert", "foot_lic": "Publisert under CC BY-ND 4.0. Tallene kan gjenskapes fra kildene nevnt over.", "note_review": "Denne siden er under vurdering og er ikke offentlig.", "lab_w": "Hva det ser etter", "lab_s": "Hvor det kommer fra", "lab_r": "Slik leses det", "det_quote": "Hva vilkårene sier", "det_source": "Kildedokument", "det_doc": "Dokumentets dato", "det_comp": "Hva de publiserer", "first_1b": "<b>Det telles to forskjellige ting.</b> En godkjenning er en lisens, utstedt av ICANN, til å selge domenenavn. Et nettsted er selskapets eget nettsted, det lisensen peker på. Ett selskap kan ha mange lisenser, så lisensene er flere enn selskapene, ikke omvendt. Fire nettsteder alene ligger bak 2 270 av de 3 322.", "first_web": "<b>En merknad: dette er det åpne nettet, ikke det mørke nettet.</b> Alt her handler om vanlige nettsteder, de med et navn du kan taste, som en søkemotor kan finne, og som hvem som helst når med en vanlig nettleser. Navnene leies, de eies ikke: noen betaler en registrar i denne indeksen for retten til å bruke et navn, gjerne ett år av gangen, og registraren kan ta det tilbake. Det er hele grunnen til at dette leddet har makt i det hele tatt. Det mørke nettet fungerer annerledes. Adressene der selges ikke av noen, det finnes ikke noe selskap å skrive til og ingen kontrakt å peke på, så ingenting i denne indeksen når dit. Det er en reell begrensning ved det som måles her, og det er også derfor det åpne nettet er verdt å måle: det er delen der et identifiserbart selskap har navnet, kontrakten og forpliktelsen.", "l5_t": "Hvor raskt de handler", "l5_q": "Når en gyldig melding er sendt, hvor lang tid tar fjerningen egentlig?", "l5_w": "Ingenting. Dette laget er tomt, og det fraværet er det viktigste på siden.", "l5_s": "Ingen offentlig kilde oppgir fjerningstid på dette nivået.", "l5_r": "Alt over måler hva et selskap sier. Dette laget ville måle hva det gjør. Uten det kan ikke indeksen ennå skille et selskap som overser meldinger fra ett som er tregt, men handler.", "l5_ask_h": "Hva som ville fylle dette laget", "l5_ask": "Tre ting, fra alle som melder i stort omfang. Hvilke hostingselskaper går igjen. Hvilke registrarer går igjen, inkludert ny registrering etter en nedtaking. Tid fra gyldig melding til fjerning, per selskap, i grove intervaller, med en pekepinn på hvor mange meldinger som ligger bak. Aggregert går fint. Historisk går fint. Grovt går fint.", "l5_cta": "Har dere noe av dette, så skriv til oss", "l4_t": "Hvor filene ligger", "l4_q": "Hvilke selskaper har faktisk materialet når et navn først peker dit?", "l4_w": "Navngitte leverandører med publiserte fjerningstall fra to uavhengige rapporter. Det som mangler er noe aktuelt, og noe på registrarleddet.", "l4_s": "To publiserte rapporter: CSAM Hosting Monitor (TU Delft med EOKM) og Project Arachnid (C3P). Begge navngir leverandører. Ingen av dem er aktuelle, og ingen av dem dekker registrarer.", "l4_r": "En registrar kan ta bort et navn, men filene overlever og dukker opp igjen under et nytt navn. Uten dette laget følger indeksen bare halve kjeden.", "l4_ask_h": "Hva som ville fylle dette laget", "l4_ask": "To ting. Aktuelle tall, fordi de nyeste publiserte er fra 2023 og Project Arachnids fra 2018 til 2020. Og registraren bak hver sak, som meldende organisasjoner har i sine egne registre, men som ingen noen gang har aggregert. Selskapsnavn, antall og tidsintervaller. Ingen lenker, intet materiale, ingen saksdetaljer.", "l4_cta": "Har dere noe av dette, så skriv til oss", "st_built": "Bygget på offentlige kilder", "st_empty": "Ikke bygget ennå", "st_h": "Status", "l6_t": "Hvor ofte det kommer tilbake", "l6_q": "Etter at noe er fjernet, hvor ofte dukker den samme aktøren opp igjen?", "l6_w": "Ingenting ennå. Ny registrering etter en nedtaking ses i enkeltsaker, men ikke som en rate noen publiserer.", "l6_s": "Ville komme fra gjentatte meldinger hos organisasjoner som melder det samme materialet mer enn én gang.", "l6_r": "En nedtaking som er omgjort innen en uke, er ingen nedtaking. En tilbakefallsrate er det som skiller håndheving som holder fra håndheving som bare ser slik ut.", "l6_ask_h": "Hva som ville fylle dette laget", "l6_ask": "For det samme materialet eller den samme aktøren: hvor ofte det dukker opp igjen etter fjerning, over hvilket intervall, og om det kommer tilbake til det samme hostingselskapet eller den samme registraren. Bare tall og rater, aldri saker.", "l6_cta": "Har dere noe av dette, så skriv til oss", "worst_h": "Hvor hullet er størst", "col_reach": "Lisenser bak det", "worst_x": "Aktørene som rekker lengst, og hva hver av dem har skrevet ned. Rangert etter hvor mange lisenser som ligger bak ett nettsted, fordi det er der én beslutning veier tyngst.", "worst_note": "<b>Les dette nøye.</b> Dette er ikke en liste over de verste selskapene, og det er ikke en liste over selskaper som lagrer overgrepsmateriale. Det er en liste over de største aktørene, som viser hva deres egne vilkår sier. De tre største, som til sammen ligger bak 2 219 lisenser, bruker bare generelle formuleringer: ingenting i deres publiserte vilkår nevner materiale om seksuelle overgrep mot barn. Det er en konstatering om dokumentene deres. Det sier ingenting om hva som ligger på serverne deres.", "l4_ex_h": "Et konkret eksempel på hullet", "l4_ex": "Vi har rekonstruert én sak utelukkende fra offentlige rutingdata. Tre selskaper som alle fremstår som aktører i ett EU-land, der ett av dem faktisk er registrert offshore. Adresserommet deres flytter seg mellom dem: et område forlater det første selskapet til fordel for det andre, et tredje overtar plassen, og det første slutter helt å annonsere noen uker senere. Offentlige data viser bevegelsen. De kan ikke vise om noen meldte fra om innholdet, hvor lang tid fjerningen tok, eller om det samme materialet kom tilbake i det nye området. Det er nettopp de dataene vi ber om. Vi har de tre selskapsnavnene og publiserer dem ikke, fordi en registrering av flyttet adresserom ikke er en konstatering om innhold, og ingen har hatt rett til å svare.", "st_partial": "Delvis bygget, fra publiserte rapporter", "pub_h": "Hva som allerede er publisert", "ev_provider": "Leverandør", "ev_figure": "Hva kilden rapporterer", "ev_source": "Kilde", "ev_year": "Data fra", "l4_pub": "Dette laget er ikke tomt, det er utdatert. Førti hostingleverandører er navngitt med tall i publiserte rapporter: CSAM Hosting Monitor fra TU Delft og EOKM, og Project Arachnid hos Canadian Centre for Child Protection. Hver rad nedenfor gjengir hva kilden rapporterer, og lenker til den.", "l5_pub": "Project Arachnid oppgir en median fjerningstid på 24 timer etter melding, der de tregeste 10% bruker 42 dager eller mer, og finner at bare 25% av selskapene fjernet materiale innen én dag i 2020-21, ned fra 28% i 2017-18. I Nederland lå fjerning innen 24 timer på 84% i 2020 og 87% i 2021, falt til 40% i 2022 da den frivillige overvåkingen opphørte, og var rundt 59% i 2024; et lovpålagt pålegg om fjerning innen 12 timer har gjeldt siden juli 2024. Alt på leverandør- eller landnivå. Ingenting på registrarnivå.", "l6_pub": "Project Arachnid oppgir at 48% av de meldte bildene tidligere var flagget hos den samme leverandøren, det eneste publiserte tilbakefallstallet på feltet. De publiserer også en rate per leverandør: 93,6% for den høyeste målte, 93,5% for den nest høyeste. Ingenting tilsvarende er noen gang publisert for registrarer, og ingenting i det hele tatt siden 2020."}, "sv": {"lang": "Svenska", "kicker": "Foreningen Custorian · Under granskning, inte offentlig", "title": "Indexet över mellanhänders ansvarstagande", "lede": "Ingen skadlig webbplats står ensam. Ett företag sålde namnet, ett annat lagrar filerna, och andra bär trafiken. Det här indexet visar vad de företagen har lovat om material med sexuella övergrepp mot barn, och hur långt det löftet räcker.", "first_h": "Läs det här först", "first_1": "<b>Vad är en mellanhand?</b> Mellan ett barn och skadligt material finns flera företag. Ett sålde webbplatsens namn och kallas registrar. Ett lagrar själva filerna och kallas värdtjänst. Andra bär trafiken mellan dem. Inget av dem skapade materialet, och alla kan agera på det. Det här indexet mäter dem, med registrarer först, eftersom det är där den offentliga dokumentationen är rikast: det finns 3 322 ackrediteringar i världen, och det är det led som nästan ingen granskar.", "first_2": "<b>Vad indexet säger.</b> Det visar vad en registrar själv har skrivit i sina offentliga villkor, och vad offentliga tillsynsärenden visar. Inget annat.", "first_3": "<b>Vad indexet aldrig säger.</b> Det påstår aldrig att en registrar lagrar övergreppsmaterial. Det går inte att fastställa på den här nivån, så vi hävdar det inte. Ett lågt betyg betyder att ett företag inte har skrivit ned något. Det är ingen anklagelse.", "stats_h": "Bilden i fyra siffror", "s1": "licenser att sälja domännamn", "s1x": "ICANN-ackrediteringar. Ett företag kan inneha många av dem, så detta är inte ett antal företag.", "s2": "separata registrarwebbplatser", "s2x": "Varje licens pekar på en företagswebbplats, och många licenser pekar på samma. Enbart namebright.com ligger bakom 1 252 av dem. Så 3 322 licenser blir omkring 1 007 aktörer, inte fler.", "s3": "nämner material med sexuella övergrepp mot barn", "s3x": "Av de 446 villkor vi kunde läsa nämner så många det uttryckligen.", "s4": "median för öppenhet", "s4x": "Av 100. Hälften av de bedömda registrarerna ligger under detta.", "layers_h": "Så är indexet uppbyggt, lager för lager", "layers_x": "Fyra lager som var och ett svarar på sin fråga. Välj ett för att läsa vad det söker efter och vad det fann.", "l1_t": "Vem står bakom", "l1_q": "Är det separata företag, eller en aktör med många namn?", "l1_w": "Vi grupperar ackrediteringar som delar webbplats. Fyra webbplatser bär ensamma 2 270 av de 3 322 ackrediteringarna.", "l1_s": "ICANN:s egen offentliga lista över ackrediterade registrarer.", "l1_r": "Ett kluster är inte i sig klandervärt. Återförsäljare och förvärv ser likadana ut utifrån. Det visar var ett enda beslut når längst.", "l2_t": "Vad de lovar", "l2_q": "Nämner företagets egna villkor över huvud taget material med sexuella övergrepp mot barn?", "l2_w": "Vi läser varje registrars publicerade villkor och noterar om orden står där, om det bara står en allmän formulering som olagligt innehåll, eller om inget står.", "l2_s": "Registrarens egna publicerade villkor, hämtade och citerade.", "l2_r": "Att nämna det är inget bevis för handling. Att inte nämna det betyder att företaget inte skriftligen har förbundit sig till just det som det skulle bedömas på.", "l3_t": "Vad de visar offentligt", "l3_q": "Utöver avtalet: vad publicerar företaget faktiskt, och vad har ICANN funnit?", "l3_w": "Två skilda poäng, som aldrig slås ihop. En för det en registrar frivilligt uppger: en kontaktadress för missbruk, en väg till en stödlinje, ett uttalat åtagande, namngivna kategorier, en hänvisning till EU-regler. En för ICANN:s formella ärenden om avtalsbrott.", "l3_s": "Registrarernas egna informationssidor och ICANN:s offentliga tillsynsbrev.", "l3_r": "En frivillig handling och ett ålagt beslut är olika slags fakta med olika rätt att bemöta, så de hålls isär.", "grades_h": "Så läser du ett betyg", "grades_x": "Betyget är öppenhetspoängen i lager 3, av 100. Det mäter vad en registrar publicerar, inget annat.", "gA": "Publicerar nästan allt vi söker efter", "gB": "Publicerar det mesta", "gC": "Publicerar en del av det", "gD": "Publicerar lite", "gF": "Publicerar nästan inget", "gN": "Inte bedömd. Vi kunde inte hämta villkoren, så det finns ingen slutsats åt något håll. Räknas aldrig som noll.", "table_h": "Registrarledet i sin helhet", "search": "Sök företag eller webbplats", "f_all": "Alla betyg", "f_csam": "Nämner övergreppsmaterial", "f_enf": "Har ett tillsynsärende", "f_clu": "I ett delat webbplatskluster", "showing": "visar", "of": "av", "col_site": "Webbplats", "col_names": "Företag", "col_acc": "Ackrediteringar", "col_prom": "Vad villkoren nämner", "col_score": "Öppenhet", "col_enf": "ICANN-ärenden", "p_named": "Nämner övergreppsmaterial", "p_child": "Nämner barnskydd, inte övergreppsmaterial", "p_catch": "Endast allmän formulering", "p_none": "Inget relevant", "p_unv": "Kunde inte läsas", "more": "Visa fler", "method_h": "Metod, och vad den inte kan säga", "m1": "<b>När uppgifterna är från.</b> Villkoren hämtades ett visst datum och läses om varje månad. Tillsynsärenden hämtas varje vecka. Båda datumen står nedan, eftersom det vore fel att läsa den äldre halvan som om den vore den nya.", "m2": "<b>Overifierad är inte noll.</b> Kunde vi inte hämta ett dokument bedöms registraren inte. En saknad poäng är en lucka i vår räckvidd, inte en slutsats om företaget.", "m3": "<b>Räkning.</b> Siffror anges per webbplats eller per domän, aldrig per ackreditering. En aktör med hundratals ackrediteringar skulle annars snedvrida varje procenttal.", "m4": "<b>Koppling av tillsynsärenden.</b> ICANN anger en registrar med nummer i nyare brev och med företagsnamn i äldre. En namnträff ensam räcker aldrig: varje enskild bekräftas mot det fullständiga juridiska namnet och märks som härledd, med länk till originalbrevet.", "m5": "<b>Rätt att bemöta.</b> Är en uppgift här fel eller inaktuell, skriv till oss. Vi rättar den och noterar att vi gjorde det.", "foot_ret": "Villkor hämtade", "foot_gen": "Tillsynsärenden uppdaterade", "foot_lic": "Publicerat under CC BY-ND 4.0. Siffrorna går att återskapa från källorna ovan.", "note_review": "Den här sidan är under granskning och är inte offentlig.", "lab_w": "Vad det söker efter", "lab_s": "Varifrån det kommer", "lab_r": "Så läses det", "det_quote": "Vad villkoren säger", "det_source": "Källdokument", "det_doc": "Dokumentets datum", "det_comp": "Vad de publicerar", "first_1b": "<b>Två olika saker räknas.</b> En ackreditering är en licens, utfärdad av ICANN, att sälja domännamn. En webbplats är företagets egen sida, den som licensen pekar på. Ett företag kan inneha många licenser, så licenserna är fler än företagen, inte tvärtom. Fyra webbplatser ligger ensamma bakom 2 270 av de 3 322.", "first_web": "<b>En notering: det här är det öppna nätet, inte det mörka nätet.</b> Allt här gäller vanliga webbplatser, de med ett namn du kan skriva in, som en sökmotor kan hitta och som vem som helst når med en vanlig webbläsare. Namnen hyrs, de ägs inte: någon betalar en registrar i det här indexet för rätten att använda ett namn, oftast ett år i taget, och registraren kan ta tillbaka det. Det är hela skälet till att det här ledet har någon makt alls. Det mörka nätet fungerar annorlunda. Dess adresser säljs inte av någon, det finns inget företag att skriva till och inget avtal att peka på, så ingenting i det här indexet når dit. Det är en verklig begränsning i det som mäts här, och det är också därför det öppna nätet är värt att mäta: det är den del där ett identifierbart företag har namnet, avtalet och skyldigheten.", "l5_t": "Hur snabbt de agerar", "l5_q": "När en giltig anmälan är gjord, hur lång tid tar borttagningen i praktiken?", "l5_w": "Ingenting. Det här lagret är tomt, och den frånvaron är det viktigaste på sidan.", "l5_s": "Ingen offentlig källa redovisar borttagningstid på den här nivån.", "l5_r": "Allt ovanför mäter vad ett företag säger. Det här lagret skulle mäta vad det gör. Utan det kan indexet ännu inte skilja ett företag som ignorerar anmälningar från ett som är långsamt men agerar.", "l5_ask_h": "Vad som skulle fylla det här lagret", "l5_ask": "Tre saker, från alla som anmäler i stor skala. Vilka hostingföretag återkommer. Vilka registrarer återkommer, inklusive ny registrering efter en nedtagning. Tid från giltig anmälan till borttagning, per företag, i grova intervall, med en känsla för hur många anmälningar som ligger bakom. Aggregerat går bra. Historiskt går bra. Grovt går bra.", "l5_cta": "Har ni något av detta, skriv till oss", "l4_t": "Var filerna ligger", "l4_q": "Vilka företag har faktiskt materialet när ett namn väl pekar dit?", "l4_w": "Namngivna leverantörer med publicerade borttagningssiffror från två oberoende rapporter. Det som saknas är något aktuellt, och något på registrarledet.", "l4_s": "Två publicerade rapporter: CSAM Hosting Monitor (TU Delft med EOKM) och Project Arachnid (C3P). Båda namnger leverantörer. Ingen av dem är aktuell, och ingen täcker registrarer.", "l4_r": "En registrar kan ta bort ett namn, men filerna överlever och dyker upp igen under ett nytt namn. Utan det här lagret följer indexet bara halva kedjan.", "l4_ask_h": "Vad som skulle fylla det här lagret", "l4_ask": "Två saker. Aktuella siffror, eftersom de senaste publicerade är från 2023 och Project Arachnids från 2018 till 2020. Och registraren bakom varje ärende, som anmälande organisationer har i sina egna register men som ingen någonsin har sammanställt. Företagsnamn, antal och tidsintervall. Inga länkar, inget material, inga ärendedetaljer.", "l4_cta": "Har ni något av detta, skriv till oss", "st_built": "Byggt på offentliga källor", "st_empty": "Inte byggt ännu", "st_h": "Status", "l6_t": "Hur ofta det kommer tillbaka", "l6_q": "Efter att något tagits bort, hur ofta dyker samma aktör upp igen?", "l6_w": "Inget ännu. Ny registrering efter en nedtagning syns i enskilda fall, men inte som en andel någon publicerar.", "l6_s": "Skulle komma från upprepade anmälningar hos organisationer som anmäler samma material mer än en gång.", "l6_r": "En nedtagning som är ogjord inom en vecka är ingen nedtagning. En återfallsandel är det som skiljer tillsyn som håller från tillsyn som bara ser ut att göra det.", "l6_ask_h": "Vad som skulle fylla det här lagret", "l6_ask": "För samma material eller samma aktör: hur ofta det dyker upp igen efter borttagning, över vilket intervall, och om det återvänder till samma hostingföretag eller samma registrar. Endast antal och andelar, aldrig ärenden.", "l6_cta": "Har ni något av detta, skriv till oss", "worst_h": "Var luckan är störst", "col_reach": "Licenser bakom den", "worst_x": "De aktörer som når längst, och vad var och en har skrivit ned. Rangordnade efter hur många licenser som ligger bakom en enda webbplats, eftersom det är där ett beslut väger tyngst.", "worst_note": "<b>Läs det här noga.</b> Det här är ingen lista över de sämsta företagen, och ingen lista över företag som lagrar övergreppsmaterial. Det är en lista över de största aktörerna, som visar vad deras egna villkor säger. De tre största, som tillsammans ligger bakom 2 219 licenser, använder endast allmänna formuleringar: inget i deras publicerade villkor nämner material med sexuella övergrepp mot barn. Det är en iakttagelse om deras dokument. Den säger ingenting om vad som finns på deras servrar.", "l4_ex_h": "Ett konkret exempel på luckan", "l4_ex": "Vi har rekonstruerat ett fall enbart utifrån offentliga routingdata. Tre företag som alla framstår som aktörer i ett EU-land, varav ett i själva verket är registrerat offshore. Deras adressrymd flyttas mellan dem: ett intervall lämnar det första företaget till det andra, ett tredje tar över utrymmet, och det första slutar helt att annonsera några veckor senare. Offentliga data visar rörelsen. De kan inte visa om någon anmälde innehållet, hur lång tid borttagningen tog, eller om samma material kom tillbaka i det nya intervallet. Det är precis de uppgifter vi efterfrågar. Vi har de tre företagsnamnen och publicerar dem inte, eftersom en notering om flyttad adressrymd inte är en iakttagelse om innehåll, och ingen har haft möjlighet att bemöta.", "st_partial": "Delvis byggt, från publicerade rapporter", "pub_h": "Vad som redan är publicerat", "ev_provider": "Leverantör", "ev_figure": "Vad källan rapporterar", "ev_source": "Källa", "ev_year": "Data från", "l4_pub": "Det här lagret är inte tomt, det är inaktuellt. Fyrtio hostingleverantörer namnges med siffror i publicerade rapporter: CSAM Hosting Monitor från TU Delft och EOKM, samt Project Arachnid vid Canadian Centre for Child Protection. Varje rad nedan återger vad källan rapporterar och länkar till den.", "l5_pub": "Project Arachnid anger en median borttagningstid på 24 timmar efter anmälan, där de långsammaste 10% tar 42 dagar eller mer, och finner att endast 25% av företagen tog bort material inom en dag 2020-21, ned från 28% 2017-18. I Nederländerna låg borttagning inom 24 timmar på 84% 2020 och 87% 2021, föll till 40% 2022 när den frivilliga övervakningen upphörde, och låg kring 59% 2024; ett lagstadgat föreläggande om borttagning inom 12 timmar gäller sedan juli 2024. Allt på leverantörs- eller landsnivå. Inget på registrarnivå.", "l6_pub": "Project Arachnid anger att 48% av de anmälda bilderna tidigare hade flaggats hos samma leverantör, den enda publicerade återfallssiffran på området. De publicerar även en andel per leverantör: 93,6% för den högsta uppmätta, 93,5% för den näst högsta. Inget motsvarande har någonsin publicerats för registrarer, och inget alls sedan 2020."}, "fi": {"lang": "Suomi", "kicker": "Foreningen Custorian · Arvioitavana, ei julkinen", "title": "Välittäjien vastuullisuusindeksi", "lede": "Mikään haitallinen sivusto ei ole yksin. Yksi yritys myi sen nimen, toinen säilyttää tiedostot ja muut kuljettavat liikenteen. Tämä indeksi kertoo, mitä nämä yritykset ovat luvanneet lasten seksuaalista hyväksikäyttöä esittävästä aineistosta ja kuinka pitkälle lupaus kantaa.", "first_h": "Lue tämä ensin", "first_1": "<b>Mikä on välittäjä?</b> Lapsen ja haitallisen aineiston välissä on useita yrityksiä. Yksi myi sivuston nimen, ja sitä kutsutaan rekisterinpitäjäksi. Yksi säilyttää itse tiedostot, ja sitä kutsutaan palveluntarjoajaksi. Muut kuljettavat liikenteen niiden välillä. Kukaan niistä ei tehnyt aineistoa, ja kaikki voivat puuttua siihen. Tämä indeksi mittaa niitä, rekisterinpitäjistä alkaen, koska siellä julkinen aineisto on rikkainta: valtuutuksia on maailmassa 3 322, ja tätä tasoa ei juuri kukaan tarkastele.", "first_2": "<b>Mitä indeksi kertoo.</b> Se kertoo, mitä rekisterinpitäjä on itse kirjannut julkisiin ehtoihinsa ja mitä julkiset valvonta-asiakirjat osoittavat. Ei muuta.", "first_3": "<b>Mitä indeksi ei koskaan väitä.</b> Se ei koskaan väitä, että rekisterinpitäjä säilyttää hyväksikäyttöaineistoa. Sitä ei voi todeta tällä tasolla, joten emme sitä väitä. Heikko arvosana tarkoittaa, ettei yritys ole kirjannut jotakin ylös. Se ei ole syytös.", "stats_h": "Kokonaiskuva neljänä lukuna", "s1": "lupaa myydä verkkotunnuksia", "s1x": "ICANN-valtuutuksia. Yhdellä yrityksellä voi olla niitä monta, joten tämä ei ole yritysten lukumäärä.", "s2": "erillistä rekisterinpitäjän sivustoa", "s2x": "Jokainen lupa osoittaa yrityksen sivustolle, ja moni lupa osoittaa samalle. Pelkästään namebright.com on 1 252 luvan takana. Niinpä 3 322 lupaa vastaa noin 1 007 toimijaa, ei useampaa.", "s3": "mainitsee lasten hyväksikäyttöaineiston", "s3x": "Niistä 446 ehdosta, jotka pystyimme lukemaan, näin moni mainitsee sen nimenomaisesti.", "s4": "avoimuuden mediaani", "s4x": "Sadasta. Puolet arvioiduista rekisterinpitäjistä jää tämän alle.", "layers_h": "Näin indeksi rakentuu, kerros kerrokselta", "layers_x": "Neljä kerrosta, joista kukin vastaa omaan kysymykseensä. Valitse yksi lukeaksesi, mitä se etsii ja mitä se löysi.", "l1_t": "Kuka on taustalla", "l1_q": "Ovatko n
