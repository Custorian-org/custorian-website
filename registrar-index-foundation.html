<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Registrar Accountability Index · Custorian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#0E0E10; --body:#3A3A40; --muted:#6E6E78;
  --violet:#5B41C2; --violet-l:#9B7CFF; --violet-wash:#F1EDFF;
  --rule:#E6E2DA; --rule-strong:#D5D0C6;
  --good:#1F6B4A; --good-bg:rgba(31,107,74,.10);
  --mid:#8A5A00;  --mid-bg:rgba(138,90,0,.10);
  --bad:#A32B2B;  --bad-bg:rgba(163,43,43,.09);
  --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --maxw:1120px; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E0E10; --card:#17171B; --ink:#F6F4EF; --body:#C9C6C0; --muted:#8E8E98;
  --violet:#9B7CFF; --violet-l:#B9A3FF; --violet-wash:#1E1A2E;
  --rule:#26262C; --rule-strong:#33333A;
  --good:#5FD3A0; --good-bg:rgba(95,211,160,.12);
  --mid:#E0A94E;  --mid-bg:rgba(224,169,78,.12);
  --bad:#FF8A8A;  --bad-bg:rgba(255,138,138,.12);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
h1,h2,h3{color:var(--ink);letter-spacing:-.02em;margin:0}
a{color:var(--violet);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:currentColor}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:4px}

/* top bar */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.03em;margin-right:auto}
.brand span{color:var(--violet)}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:5px 9px;border-radius:999px;border:1px solid var(--rule-strong);background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.langs button:hover{color:var(--ink);border-color:var(--violet-l)}
.langs button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}

/* hero */
.hero{padding:56px 0 34px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin-bottom:14px}
h1{font-size:clamp(30px,5.2vw,52px);font-weight:800;line-height:1.06;max-width:16ch}
.lede{font-size:clamp(16px,2.1vw,19px);line-height:1.55;max-width:62ch;margin-top:18px;color:var(--body)}
.review{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:7px 13px;border-radius:999px;background:var(--violet-wash);color:var(--violet);font-size:13px;font-weight:600}
.review::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--violet)}

/* generic section */
section{padding:34px 0}
.sec-h{font-size:clamp(20px,3vw,27px);font-weight:700;margin-bottom:6px}
.sec-x{color:var(--muted);max-width:66ch;margin-bottom:22px}

/* read first */
.first{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:24px;display:grid;gap:14px}
.first p{margin:0;max-width:78ch}
.first p b{color:var(--ink)}
.first p:last-child{padding-top:14px;border-top:1px solid var(--rule)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.stat .n{font-size:clamp(26px,3.6vw,36px);font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1}
.stat .l{font-weight:600;color:var(--ink);margin-top:8px;font-size:14px}
.stat .x{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}

/* layers */
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ltab{flex:1 1 200px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;font-family:inherit}
.ltab:hover{border-color:var(--violet-l)}
.ltab[aria-selected="true"]{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}
.ltab .num{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--violet)}
.ltab .t{display:block;font-weight:700;color:var(--ink);margin-top:4px;font-size:15px;letter-spacing:-.01em}
.ltab .q{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.lpanel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:26px}
.lpanel .lq{font-size:clamp(17px,2.3vw,21px);font-weight:700;color:var(--ink);max-width:44ch;line-height:1.3}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px}
.lgrid h4{margin:0 0 5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.lgrid p{margin:0;font-size:14.5px;line-height:1.55}
.ask{margin-top:22px;padding:20px;border-radius:12px;background:var(--violet-wash);border:1px solid color-mix(in srgb,var(--violet) 25%,transparent)}
.ask h4{margin:0 0 6px;font-size:15px;color:var(--ink)}
.ask p{margin:0;font-size:14.5px}
.ask a{display:inline-block;margin-top:12px;font-weight:600;border-bottom:1px solid currentColor}

/* grades */
.glist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 15px}
.pill{font-family:var(--mono);font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;flex:none}
.pA,.pB{color:var(--good);background:var(--good-bg)}
.pC{color:var(--mid);background:var(--mid-bg)}
.pD,.pF{color:var(--bad);background:var(--bad-bg)}
.pN{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.g span.d{font-size:13.5px;line-height:1.45}

/* table */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.controls input,.controls select{font-family:inherit;font-size:14px;padding:9px 13px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--card);color:var(--ink)}
.controls input{flex:1 1 260px}
.chk{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:0 0 auto;font-size:13.5px;color:var(--body);background:var(--card);border:1px solid var(--rule-strong);padding:9px 13px;border-radius:10px;cursor:pointer;user-select:none}
.chk:hover{border-color:var(--violet-l)}
.chk input{accent-color:var(--violet);margin:0}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule-strong);font-weight:500;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:top}
tr.r{cursor:pointer}
tr.r:hover td{background:color-mix(in srgb,var(--violet) 4%,transparent)}
.host{font-weight:600;color:var(--ink)}
.co{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:999px;background:var(--violet-wash);color:var(--violet);margin-left:6px;vertical-align:1px}
.score{display:flex;align-items:center;gap:9px}
.bar{width:64px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:99px;background:var(--violet)}
.det td{background:color-mix(in srgb,var(--violet) 3%,transparent);font-size:13.5px}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.det dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.det dd{margin:0}
.quote{border-left:2px solid var(--violet-l);padding-left:12px;color:var(--body);font-style:italic}
.more{display:block;margin:16px auto 0;font-family:inherit;font-size:14px;font-weight:600;color:var(--violet);background:var(--card);border:1px solid var(--rule-strong);padding:11px 22px;border-radius:10px;cursor:pointer}
.more:hover{border-color:var(--violet)}

/* method + footer */
.method{display:grid;gap:12px}
.method p{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:15px 18px;margin:0;font-size:14.5px}
.method p b{color:var(--ink)}
footer{border-top:1px solid var(--rule);margin-top:34px;padding:26px 0 56px;font-size:13px;color:var(--muted)}
.dates{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;margin-bottom:10px}
.dates b{color:var(--ink);font-weight:500}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .lgrid,.glist{grid-template-columns:1fr}
  .hero{padding:38px 0 26px}
}
@media(max-width:700px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.r{border-bottom:1px solid var(--rule);padding:6px 0}
  td{border:0;padding:5px 14px}
  td::before{content:attr(data-l);display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .count{margin-left:0}
}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">Custorian<span>.</span></div>
  <nav class="langs" id="langs" aria-label="Language"></nav>
</div></div>

<header class="hero"><div class="wrap">
  <div class="kicker" data-t="kicker"></div>
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="review" data-t="note_review"></div>
</div></header>

<main>
<section><div class="wrap">
  <h2 class="sec-h" data-t="first_h"></h2>
  <div class="first">
    <p data-t="first_1"></p>
    <p data-t="first_1b"></p>
    <p data-t="first_2"></p>
    <p data-t="first_3"></p>
  </div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="stats_h"></h2>
  <div class="stats">
    <div class="stat"><div class="n" id="n1"></div><div class="l" data-t="s1"></div><div class="x" data-t="s1x"></div></div>
    <div class="stat"><div class="n" id="n2"></div><div class="l" data-t="s2"></div><div class="x" data-t="s2x"></div></div>
    <div class="stat"><div class="n" id="n3"></div><div class="l" data-t="s3"></div><div class="x" data-t="s3x"></div></div>
    <div class="stat"><div class="n" id="n4"></div><div class="l" data-t="s4"></div><div class="x" data-t="s4x"></div></div>
  </div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="layers_h"></h2>
  <p class="sec-x" data-t="layers_x"></p>
  <div class="ltabs" role="tablist" id="ltabs"></div>
  <div class="lpanel" id="lpanel" role="tabpanel"></div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="grades_h"></h2>
  <p class="sec-x" data-t="grades_x"></p>
  <div class="glist" id="glist"></div>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="table_h"></h2>
  <div class="controls">
    <input id="q" type="search" data-p="search" aria-label="Search">
    <select id="fg"></select>
    <label class="chk"><input type="checkbox" id="fc"> <span data-t="f_csam"></span></label>
    <label class="chk"><input type="checkbox" id="fk"> <span data-t="f_clu"></span></label>
    <div class="count" id="count"></div>
  </div>
  <table><thead><tr>
    <th data-t="col_site"></th><th data-t="col_acc"></th><th data-t="col_prom"></th><th data-t="col_score"></th>
  </tr></thead><tbody id="tb"></tbody></table>
  <button class="more" id="more" data-t="more"></button>
</div></section>

<section><div class="wrap">
  <h2 class="sec-h" data-t="method_h"></h2>
  <div class="method">
    <p data-t="m1"></p><p data-t="m2"></p><p data-t="m3"></p><p data-t="m4"></p><p data-t="m5"></p>
  </div>
</div></section>
</main>

<footer><div class="wrap">
  <div class="dates">
    <span><span data-t="foot_ret"></span>: <b id="dret"></b></span>
    <span><span data-t="foot_gen"></span>: <b id="dgen"></b></span>
  </div>
  <div data-t="foot_lic"></div>
</div></footer>

<script>
const I18N = {"en": {"lang": "English", "kicker": "Foreningen Custorian · In review, not public", "title": "The Registrar Accountability Index", "lede": "Every website has a company that sold its address. This index records what those companies have promised to do about child sexual abuse material, and how far that promise goes.", "first_h": "Read this first", "first_1": "<b>What is a registrar?</b> When someone sets up a website, they buy its address from a registrar: a company accredited by ICANN to sell domain names. There are 3,322 such accreditations worldwide, and they are the layer almost nobody looks at.", "first_2": "<b>What this index says.</b> It records what a registrar has written down in its own public agreement, and what public enforcement records show. Nothing else.", "first_3": "<b>What this index never says.</b> It never claims a registrar hosts abuse material. That cannot be established at this level, so we do not assert it. A low grade means a company has not written something down. It is not an accusation.", "stats_h": "The picture in four numbers", "s1": "licences to sell domain names", "s1x": "ICANN accreditations. One company can hold many of them, so this is not a count of companies.", "s2": "distinct registrar websites", "s2x": "Each licence points at a company website, and many licences point at the same one. namebright.com alone sits behind 1,252 of them. So 3,322 licences resolve to roughly 1,007 operators, not more.", "s3": "name child sexual abuse material", "s3x": "Of the 446 agreements we could read, this many name it specifically.", "s4": "median transparency score", "s4x": "Out of 100. Half of all scored registrars fall below this.", "layers_h": "How the index is built, layer by layer", "layers_x": "Four layers, each answering a different question. Select one to read what it looks for and what it found.", "l1_t": "Who is behind it", "l1_q": "Are these separate companies, or one operation wearing many hats?", "l1_w": "We group accreditations that share a website. Four websites alone carry 2,270 of the 3,322 accreditations.", "l1_s": "ICANN's own public list of accredited registrars.", "l1_r": "A cluster is not wrongdoing. Resellers and acquisitions look identical from outside. It tells you where a single decision reaches furthest.", "l2_t": "What they promise", "l2_q": "Does the company's own agreement name child sexual abuse material at all?", "l2_w": "We read each registrar's published terms and record whether the words appear, whether only a catch-all like 'illegal content' appears, or whether nothing does.", "l2_s": "The registrar's own published agreement, retrieved and quoted.", "l2_r": "Naming it is not proof of action. Not naming it means a company has not committed in writing to the thing it would be judged on.", "l3_t": "What they show in public", "l3_q": "Beyond the contract, what does the company actually publish, and what has ICANN found?", "l3_w": "Two separate scores, never merged. One for what a registrar volunteers: an abuse contact, a route to a hotline, a stated commitment, named categories, a reference to EU rules. One for ICANN's formal record of breaches.", "l3_s": "Registrar disclosure pages, and ICANN's public compliance notices.", "l3_r": "A voluntary act and an imposed finding are different kinds of fact and carry different rights of reply, so they are kept apart.", "l4_t": "How fast they act", "l4_q": "Once a valid report is filed, how long does removal actually take?", "l4_w": "Nothing. This layer is empty, and that absence is the most important thing on this page.", "l4_s": "No public source reports removal time at this level.", "l4_r": "Everything above measures what a company says. This layer would measure what it does. Without it, the index cannot yet tell a company that ignores reports from one that is slow but acts.", "l4_ask_h": "What would fill this layer", "l4_ask": "Three things, from anyone who files reports at scale. Which hosting companies recur. Which registrars recur, including re-registration after a takedown. Time from a valid report to removal, per company, in rough bands, with a sense of how many reports sit behind each. Aggregated is fine. Historical is fine. Coarse is fine.", "l4_cta": "If you hold any of this, write to us", "grades_h": "How to read a grade", "grades_x": "The grade is the transparency score in Layer 3, out of 100. It measures what a registrar publishes, nothing more.", "gA": "Publishes nearly everything we look for", "gB": "Publishes most of it", "gC": "Publishes some of it", "gD": "Publishes little", "gF": "Publishes almost none of it", "gN": "Not scored. We could not retrieve the agreement, so there is no finding either way. Never counted as zero.", "table_h": "Every registrar website in the index", "search": "Search a company or website", "f_all": "All grades", "f_csam": "Names abuse material", "f_enf": "Has an enforcement notice", "f_clu": "In a shared-website cluster", "showing": "showing", "of": "of", "col_site": "Website", "col_names": "Companies", "col_acc": "Accreditations", "col_prom": "What the agreement names", "col_score": "Transparency", "col_enf": "ICANN notices", "p_named": "Names abuse material", "p_child": "Names child protection, not abuse material", "p_catch": "Catch-all wording only", "p_none": "Nothing on point", "p_unv": "Could not be read", "more": "Show more", "method_h": "Method, and what it cannot tell you", "m1": "<b>When the data is from.</b> Agreements were retrieved on one date and re-read monthly. Enforcement notices are re-pulled weekly. Both dates are shown below, because reading the older half as though it were the newer one would be a mistake.", "m2": "<b>Unverified is not zero.</b> If we could not retrieve a document, the registrar is not scored. A missing score is a gap in our reach, not a finding about the company.", "m3": "<b>Counting.</b> Figures are given per website or per domain, never per accreditation. One operator holding hundreds of accreditations would otherwise distort every percentage.", "m4": "<b>Matching enforcement notices.</b> ICANN identifies a registrar by number on recent notices and by company name on older ones. A name match alone is never enough: each is confirmed against the full legal name and labelled as inferred, with a link to the original letter.", "m5": "<b>Right of reply.</b> If a record here is wrong or out of date, write to us and we will correct it, and record that we did.", "foot_ret": "Agreements retrieved", "foot_gen": "Enforcement updated", "foot_lic": "Published under CC BY-ND 4.0. Figures are reproducible from the sources named above.", "note_review": "This page is in review and is not public.", "lab_w": "What it looks for", "lab_s": "Where it comes from", "lab_r": "How to read it", "det_quote": "What the agreement says", "det_source": "Source document", "det_doc": "Document date", "det_comp": "What it publishes", "first_1b": "<b>Two different things are being counted.</b> An accreditation is a licence, issued by ICANN, to sell domain names. A website is the company's own site, the one that licence points at. One company can hold many licences, so licences outnumber companies rather than the other way round. Four websites alone sit behind 2,270 of the 3,322."}, "da": {"lang": "Dansk", "kicker": "Foreningen Custorian · Under gennemgang, ikke offentlig", "title": "Indekset over registratorers ansvarlighed", "lede": "Ethvert websted har et firma, der har solgt dets adresse. Dette indeks viser, hvad de firmaer har lovet at gøre ved materiale med seksuelt misbrug af børn, og hvor langt det løfte rækker.", "first_h": "Læs dette først", "first_1": "<b>Hvad er en registrator?</b> Når nogen opretter et websted, køber de adressen hos en registrator: et firma, der er godkendt af ICANN til at sælge domænenavne. Der findes 3.322 sådanne godkendelser globalt, og det er det led, næsten ingen ser på.", "first_2": "<b>Hvad indekset siger.</b> Det viser, hvad en registrator selv har skrevet i sine offentlige vilkår, og hvad offentlige tilsynssager viser. Intet andet.", "first_3": "<b>Hvad indekset aldrig siger.</b> Det påstår aldrig, at en registrator hoster misbrugsmateriale. Det kan ikke fastslås på dette niveau, så vi hævder det ikke. En lav karakter betyder, at et firma ikke har skrevet noget ned. Det er ikke en anklage.", "stats_h": "Billedet i fire tal", "s1": "licenser til at sælge domænenavne", "s1x": "ICANN-godkendelser. Ét firma kan have mange af dem, så dette er ikke et antal firmaer.", "s2": "selvstændige registrator-websteder", "s2x": "Hver licens peger på et firmawebsted, og mange licenser peger på det samme. Alene namebright.com ligger bag 1.252 af dem. Så 3.322 licenser bliver til omkring 1.007 aktører, ikke flere.", "s3": "nævner materiale med seksuelt misbrug af børn", "s3x": "Af de 446 vilkår, vi kunne læse, nævner så mange det udtrykkeligt.", "s4": "median for gennemsigtighed", "s4x": "Ud af 100. Halvdelen af de vurderede registratorer ligger under dette.", "layers_h": "Sådan er indekset bygget op, lag for lag", "layers_x": "Fire lag, der hver svarer på sit spørgsmål. Vælg et for at læse, hvad det ser efter, og hvad det fandt.", "l1_t": "Hvem står bag", "l1_q": "Er det selvstændige firmaer, eller én aktør med mange navne?", "l1_w": "Vi grupperer godkendelser, der deler websted. Fire websteder alene bærer 2.270 af de 3.322 godkendelser.", "l1_s": "ICANN's egen offentlige liste over godkendte registratorer.", "l1_r": "En klynge er ikke i sig selv kritisabel. Forhandlere og opkøb ser ens ud udefra. Det viser, hvor én beslutning rækker længst.", "l2_t": "Hvad de lover", "l2_q": "Nævner firmaets egne vilkår overhovedet materiale med seksuelt misbrug af børn?", "l2_w": "Vi læser hver registrators offentliggjorte vilkår og noterer, om ordene står der, om der kun står en generel formulering som ulovligt indhold, eller om der intet står.", "l2_s": "Registratorens egne offentliggjorte vilkår, hentet og citeret.", "l2_r": "At nævne det er ikke Denne side er under gennemgang og er ikke offentlig.", "lab_w": "Hvad det ser efter", "lab_s": "Hvor det kommer fra", "lab_r": "Sådan læses det", "det_quote": "Hvad vilkårene siger", "det_source": "Kildedokument", "det_doc": "Dokumentets dato", "det_comp": "Hvad de offentliggør", "first_1b": "<b>Der tælles to forskellige ting.</b> En godkendelse er en licens, udstedt af ICANN, til at sælge domænenavne. Et websted er firmaets eget site, det som licensen peger på. Ét firma kan have mange licenser, så licenser er flere end firmaer, ikke omvendt. Alene fire websteder ligger bag 2.270 af de 3.322."}, "nb": {"lang": "Norsk", "kicker": "Foreningen Custorian · Under vurdering, ikke offentlig", "title": "Indeksen over registrarers ansvarlighet", "lede": "Hvert nettsted har et selskap som solgte adressen. Denne indeksen viser hva de selskapene har lovet å gjøre med materiale som viser seksuelle overgrep mot barn, og hvor langt det løftet rekker.", "first_h": "Les dette først", "first_1": "<b>Hva er en registrar?</b> Når noen oppretter et nettsted, kjøper de adressen av en registrar: et selskap godkjent av ICANN til å selge domenenavn. Det finnes 3 322 slike godkjenninger globalt, og dette er leddet nesten ingen ser på.", "first_2": "<b>Hva indeksen sier.</b> Den viser hva en registrar selv har skrevet i sine offentlige vilkår, og hva offentlige tilsynssaker viser. Ingenting annet.", "first_3": "<b>Hva indeksen aldri sier.</b> Den påstår aldri at en registrar lagrer overgrepsmateriale. Det kan ikke fastslås på dette nivået, så vi hevder det ikke. En lav karakter betyr at et selskap ikke har skrevet noe ned. Det er ingen anklage.", "stats_h": "Bildet i fire tall", "s1": "lisenser til å selge domenenavn", "s1x": "ICANN-godkjenninger. Ett selskap kan ha mange av dem, så dette er ikke et antall selskaper.", "s2": "selvstendige registrar-nettsteder", "s2x": "Hver lisens peker på et selskapsnettsted, og mange lisenser peker på det samme. Alene namebright.com ligger bak 1 252 av dem. Så 3 322 lisenser blir til rundt 1 007 aktører, ikke flere.", "s3": "nevner materiale om seksuelle overgrep mot barn", "s3x": "Av de 446 vilkårene vi kunne lese, nevner så mange det uttrykkelig.", "s4": "median for åpenhet", "s4x": "Av 100. Halvparten av de vurderte registrarene ligger under dette.", "layers_h": "Slik er indeksen bygget opp, lag for lag", "layers_x": "Fire lag som hver svarer på sitt spørsmål. Velg ett for å lese hva det ser etter, og hva det fant.", "l1_t": "Hvem står bak", "l1_q": "Er dette selvstendige selskaper, eller én aktør med mange navn?", "l1_w": "Vi grupperer godkjenninger som deler nettsted. Fire nettsteder alene bærer 2 270 av de 3 322 godkjenningene.", "l1_s": "ICANNs egen offentlige liste over godkjente registrarer.", "l1_r": "En klynge er ikke i seg selv kritikkverdig. Forhandlere og oppkjøp ser like ut utenfra. Det viser hvor én beslutning rekker lengst.", "l2_t": "Hva de lover", "l2_q": "Nevner selskapets egne vilkår i det hele tatt materiale om seksuelle overgrep mot barn?", "l2_w": "Vi leser hver registrars publiserte vilkår og noterer om ordene står der, om det bare står en generell formulering som ulovlig innhold, eller om det ikke står noe.", "l2_s": "Registrarens egne publiserte vilkår, hentet og sitert.", "l2_r": "Å nevne det er ikke bevis på handling. Å ikke nevne det betyr at selskapet ikke skriftlig har forpliktet seg på nettopp det det ville bli vurdert på.", "l3_t": "Hva de viser offentlig", "l3_q": "Utover kontrakten: hva publiserer selskapet faktisk, og hva har ICANN funnet?", "l3_w": "To adskilte poengsummer, aldri slått sammen. Én for det en registrar frivillig oppgir: en kontaktadresse for misbruk, en vei til en hjelpelinje, en uttalt forpliktelse, navngitte kategorier, en henvisning til EU-regler. Én for ICANNs formelle saker om brudd.", "l3_s": "Registrarenes egne informasjonssider og ICANNs offentlige tilsynsbrev.", "l3_r": "En frivillig handling og en pålagt avgjørelse er ulike slags fakta med ulik rett til å svare, så de holdes adskilt.", "l4_t": "Hvor raskt de handler", "l4_q": "Når en gyldig melding er sendt, hvor lang tid tar fjerningen egentlig?", "l4_w": "Ingenting. Dette laget er tomt, og det fraværet er det viktigste på siden.", "l4_s": "Ingen offentlig kilde oppgir fjerningstid på dette nivået.", "l4_r": "Alt over måler hva et selskap sier. Dette laget ville måle hva det gjør. Uten det kan ikke indeksen ennå skille et selskap som overser meldinger fra ett som er tregt, men handler.", "l4_ask_h": "Hva som ville fylle dette laget", "l4_ask": "Tre ting, fra alle som melder i stort omfang. Hvilke hostingselskaper går igjen. Hvilke registrarer går igjen, inkludert ny registrering etter en nedtaking. Tid fra gyldig melding til fjerning, per selskap, i grove intervaller, med en pekepinn på hvor mange meldinger som ligger bak. Aggregert går fint. Historisk går fint. Grovt går fint.", "l4_cta": "Har dere noe av dette, så skriv til oss", "grades_h": "Slik leser du en karakter", "grades_x": "Karakteren er åpenhetsscoren i lag 3, av 100. Den måler hva en registrar publiserer, ikke noe mer.", "gA": "Publiserer nesten alt vi ser etter", "gB": "Publiserer det meste", "gC": "Publiserer noe av det", "gD": "Publiserer lite", "gF": "Publiserer nesten ingenting", "gN": "Ikke vurdert. Vi fikk ikke hentet vilkårene, så det finnes ingen konklusjon noen vei. Telles aldri som null.", "table_h": "Alle registrarnettsteder i indeksen", "search": "Søk etter selskap eller nettsted", "f_all": "Alle karakterer", "f_csam": "Nevner overgrepsmateriale", "f_enf": "Har en tilsynssak", "f_clu": "I en delt nettsted-klynge", "showing": "viser", "of": "av", "col_site": "Nettsted", "col_names": "Selskaper", "col_acc": "Godkjenninger", "col_prom": "Hva vilkårene nevner", "col_score": "Åpenhet", "col_enf": "ICANN-saker", "p_named": "Nevner overgrepsmateriale", "p_child": "Nevner barnevern, ikke overgrepsmateriale", "p_catch": "Bare generell formulering", "p_none": "Ingenting relevant", "p_unv": "Kunne ikke leses", "more": "Vis flere", "method_h": "Metode, og hva den ikke kan fortelle", "m1": "<b>Når dataene er fra.</b> Vilkårene ble hentet på én dato og leses på nytt månedlig. Tilsynssaker hentes ukentlig. Begge datoene står nedenfor, fordi det ville være feil å lese den eldre halvdelen som om den var den nye.", "m2": "<b>Uverifisert er ikke null.</b> Fikk vi ikke hentet et dokument, vurderes ikke registraren. En manglende score er et hull i vår rekkevidde, ikke en konklusjon om selskapet.", "m3": "<b>Telling.</b> Tall oppgis per nettsted eller per domene, aldri per godkjenning. Én aktør med hundrevis av godkjenninger ville ellers forvrenge enhver prosent.", "m4": "<b>Kobling av tilsynssaker.</b> ICANN oppgir en registrar med nummer i nyere brev og med selskapsnavn i eldre. Et navnetreff alene er aldri nok: hvert enkelt bekreftes mot det fulle juridiske navnet og merkes som utledet, med lenke til det opprinnelige brevet.", "m5": "<b>Rett til å svare.</b> Er en opplysning her feil eller utdatert, så skriv til oss. Vi retter den, og noterer at vi gjorde det.", "foot_ret": "Vilkår hentet", "foot_gen": "Tilsynssaker oppdatert", "foot_lic": "Publisert under CC BY-ND 4.0. Tallene kan gjenskapes fra kildene nevnt over.", "note_review": "Denne siden er under vurdering og er ikke offentlig.", "lab_w": "Hva det ser etter", "lab_s": "Hvor det kommer fra", "lab_r": "Slik leses det", "det_quote": "Hva vilkårene sier", "det_source": "Kildedokument", "det_doc": "Dokumentets dato", "det_comp": "Hva de publiserer", "first_1b": "<b>Det telles to forskjellige ting.</b> En godkjenning er en lisens, utstedt av ICANN, til å selge domenenavn. Et nettsted er selskapets eget nettsted, det lisensen peker på. Ett selskap kan ha mange lisenser, så lisensene er flere enn selskapene, ikke omvendt. Fire nettsteder alene ligger bak 2 270 av de 3 322."}, "sv": {"lang": "Svenska", "kicker": "Foreningen Custorian · Under granskning, inte offentlig", "title": "Indexet över registrarers ansvarstagande", "lede": "Varje webbplats har ett företag som sålde dess adress. Det här indexet visar vad de företagen har lovat att göra åt material med sexuella övergrepp mot barn, och hur långt det löftet räcker.", "first_h": "Läs det här först", "first_1": "<b>Vad är en registrar?</b> När någon skapar en webbplats köper de adressen av en registrar: ett företag som ICANN har ackrediterat att sälja domännamn. Det finns 3 322 sådana ackrediteringar i världen, och det är det led som nästan ingen granskar.", "first_2": "<b>Vad indexet säger.</b> Det visar vad en registrar själv har skrivit i sina offentliga villkor, och vad offentliga tillsynsärenden visar. Inget annat.", "first_3": "<b>Vad indexet aldrig säger.</b> Det påstår aldrig att en registrar lagrar övergreppsmaterial. Det går inte att fastställa på den här nivån, så vi hävdar det inte. Ett lågt betyg betyder att ett företag inte har skrivit ned något. Det är ingen anklagelse.", "stats_h": "Bilden i fyra siffror", "s1": "licenser att sälja domännamn", "s1x": "ICANN-ackrediteringar. Ett företag kan inneha många av dem, så detta är inte ett antal företag.", "s2": "separata registrarwebbplatser", "s2x": "Varje licens pekar på en företagswebbplats, och många licenser pekar på samma. Enbart namebright.com ligger bakom 1 252 av dem. Så 3 322 licenser blir omkring 1 007 aktörer, inte fler.", "s3": "nämner material med sexuella övergrepp mot barn", "s3x": "Av de 446 villkor vi kunde läsa nämner så många det uttryckligen.", "s4": "median för öppenhet", "s4x": "Av 100. Hälften av de bedömda registrarerna ligger under detta.", "layers_h": "Så är indexet uppbyggt, lager för lager", "layers_x": "Fyra lager som var och ett svarar på sin fråga. Välj ett för att läsa vad det söker efter och vad det fann.", "l1_t": "Vem står bakom", "l1_q": "Är det separata företag, eller en aktör med många namn?", "l1_w": "Vi grupperar ackrediteringar som delar webbplats. Fyra webbplatser bär ensamma 2 270 av de 3 322 ackrediteringarna.", "l1_s": "ICANN:s egen offentliga lista över ackrediterade registrarer.", "l1_r": "Ett kluster är inte i sig klandervärt. Återförsäljare och förvärv ser likadana ut utifrån. Det visar var ett enda beslut når längst.", "l2_t": "Vad de lovar", "l2_q": "Nämner företagets egna villkor över huvud taget material med sexuella övergrepp mot barn?", "l2_w": "Vi läser varje registrars publicerade villkor och noterar om orden står där, om det bara står en allmän formulering som olagligt innehåll, eller om inget står.", "l2_s": "Registrarens egna publicerade villkor, hämtade och citerade.", "l2_r": "Att nämna det är inget bevis för handling. Att inte nämna det betyder att företaget inte skriftligen har förbundit sig till just det som det skulle bedömas på.", "l3_t": "Vad de visar offentligt", "l3_q": "Utöver avtalet: vad publicerar företaget faktiskt, och vad har ICANN funnit?", "l3_w": "Två skilda poäng, som aldrig slås ihop. En för det en registrar frivilligt uppger: en kontaktadress för missbruk, en väg till en stödlinje, ett uttalat åtagande, namngivna kategorier, en hänvisning till EU-regler. En för ICANN:s formella ärenden om avtalsbrott.", "l3_s": "Registrarernas egna informationssidor och ICANN:s offentliga tillsynsbrev.", "l3_r": "En frivillig handling och ett ålagt beslut är olika slags fakta med olika rätt att bemöta, så de hålls isär.", "l4_t": "Hur snabbt de agerar", "l4_q": "När en giltig anmälan är gjord, hur lång tid tar borttagningen i praktiken?", "l4_w": "Ingenting. Det här lagret är tomt, och den frånvaron är det viktigaste på sidan.", "l4_s": "Ingen offentlig källa redovisar borttagningstid på den här nivån.", "l4_r": "Allt ovanför mäter vad ett företag säger. Det här lagret skulle mäta vad det gör. Utan det kan indexet ännu inte skilja ett företag som ignorerar anmälningar från ett som är långsamt men agerar.", "l4_ask_h": "Vad som skulle fylla det här lagret", "l4_ask": "Tre saker, från alla som anmäler i stor skala. Vilka hostingföretag återkommer. Vilka registrarer återkommer, inklusive ny registrering efter en nedtagning. Tid från giltig anmälan till borttagning, per företag, i grova intervall, med en känsla för hur många anmälningar som ligger bakom. Aggregerat går bra. Historiskt går bra. Grovt går bra.", "l4_cta": "Har ni något av detta, skriv till oss", "grades_h": "Så läser du ett betyg", "grades_x": "Betyget är öppenhetspoängen i lager 3, av 100. Det mäter vad en registrar publicerar, inget annat.", "gA": "Publicerar nästan allt vi söker efter", "gB": "Publicerar det mesta", "gC": "Publicerar en del av det", "gD": "Publicerar lite", "gF": "Publicerar nästan inget", "gN": "Inte bedömd. Vi kunde inte hämta villkoren, så det finns ingen slutsats åt något håll. Räknas aldrig som noll.", "table_h": "Alla registrarwebbplatser i indexet", "search": "Sök företag eller webbplats", "f_all": "Alla betyg", "f_csam": "Nämner övergreppsmaterial", "f_enf": "Har ett tillsynsärende", "f_clu": "I ett delat webbplatskluster", "showing": "visar", "of": "av", "col_site": "Webbplats", "col_names": "Företag", "col_acc": "Ackrediteringar", "col_prom": "Vad villkoren nämner", "col_score": "Öppenhet", "col_enf": "ICANN-ärenden", "p_named": "Nämner övergreppsmaterial", "p_child": "Nämner barnskydd, inte övergreppsmaterial", "p_catch": "Endast allmän formulering", "p_none": "Inget relevant", "p_unv": "Kunde inte läsas", "more": "Visa fler", "method_h": "Metod, och vad den inte kan säga", "m1": "<b>När uppgifterna är från.</b> Villkoren hämtades ett visst datum och läses om varje månad. Tillsynsärenden hämtas varje vecka. Båda datumen står nedan, eftersom det vore fel att läsa den äldre halvan som om den vore den nya.", "m2": "<b>Overifierad är inte noll.</b> Kunde vi inte hämta ett dokument bedöms registraren inte. En saknad poäng är en lucka i vår räckvidd, inte en slutsats om företaget.", "m3": "<b>Räkning.</b> Siffror anges per webbplats eller per domän, aldrig per ackreditering. En aktör med hundratals ackrediteringar skulle annars snedvrida varje procenttal.", "m4": "<b>Koppling av tillsynsärenden.</b> ICANN anger en registrar med nummer i nyare brev och med företagsnamn i äldre. En namnträff ensam räcker aldrig: varje enskild bekräftas mot det fullständiga juridiska namnet och märks som härledd, med länk till originalbrevet.", "m5": "<b>Rätt att bemöta.</b> Är en uppgift här fel eller inaktuell, skriv till oss. Vi rättar den och noterar att vi gjorde det.", "foot_ret": "Villkor hämtade", "foot_gen": "Tillsynsärenden uppdaterade", "foot_lic": "Publicerat under CC BY-ND 4.0. Siffrorna går att återskapa från källorna ovan.", "note_review": "Den här sidan är under granskning och är inte offentlig.", "lab_w": "Vad det söker efter", "lab_s": "Varifrån det kommer", "lab_r": "Så läses det", "det_quote": "Vad villkoren säger", "det_source": "Källdokument", "det_doc": "Dokumentets datum", "det_comp": "Vad de publicerar", "first_1b": "<b>Två olika saker räknas.</b> En ackreditering är en licens, utfärdad av ICANN, att sälja domännamn. En webbplats är företagets egen sida, den som licensen pekar på. Ett företag kan inneha många licenser, så licenserna är fler än företagen, inte tvärtom. Fyra webbplatser ligger ensamma bakom 2 270 av de 3 322."}, "fi": {"lang": "Suomi", "kicker": "Foreningen Custorian · Arvioitavana, ei julkinen", "title": "Rekisterinpitäjien vastuullisuusindeksi", "lede": "Jokaisella verkkosivustolla on yritys, joka myi sen osoitteen. Tämä indeksi kertoo, mitä nämä yritykset ovat luvanneet tehdä lasten seksuaalista hyväksikäyttöä esittävälle aineistolle, ja kuinka pitkälle lupaus kantaa.", "first_h": "Lue tämä ensin", "first_1": "<b>Mikä on rekisterinpitäjä?</b> Kun joku perustaa verkkosivuston, hän ostaa sen osoitteen rekisterinpitäjältä: yritykseltä, jolle ICANN on myöntänyt oikeuden myydä verkkotunnuksia. Näitä valtuutuksia on maailmassa 3 322, ja tämä on se taso, jota lähes kukaan ei tarkastele.", "first_2": "<b>Mitä indeksi kertoo.</b> Se kertoo, mitä rekisterinpitäjä on itse kirjannut julkisiin ehtoihinsa ja mitä julkiset valvonta-asiakirjat osoittavat. Ei muuta.", "first_3": "<b>Mitä indeksi ei koskaan väitä.</b> Se ei koskaan väitä, että rekisterinpitäjä säilyttää hyväksikäyttöaineistoa. Sitä ei voi todeta tällä tasolla, joten emme sitä väitä. Heikko arvosana tarkoittaa, ettei yritys ole kirjannut jotakin ylös. Se ei ole syytös.", "stats_h": "Kokonaiskuva neljänä lukuna", "s1": "lupaa myydä verkkotunnuksia", "s1x": "ICANN-valtuutuksia. Yhdellä yrityksellä voi olla niitä monta, joten tämä ei ole yritysten lukumäärä.", "s2": "erillistä rekisterinpitäjän sivustoa", "s2x": "Jokainen lupa osoittaa yrityksen sivustolle, ja moni lupa osoittaa samalle. Pelkästään namebright.com on 1 252 luvan takana. Niinpä 3 322 lupaa vastaa noin 1 007 toimijaa, ei useampaa.", "s3": "mainitsee lasten hyväksikäyttöaineiston", "s3x": "Niistä 446 ehdosta, jotka pystyimme lukemaan, näin moni mainitsee sen nimenomaisesti.", "s4": "avoimuuden mediaani", "s4x": "Sadasta. Puolet arvioiduista rekisterinpitäjistä jää tämän alle.", "layers_h": "Näin indeksi rakentuu, kerros kerrokselta", "layers_x": "Neljä kerrosta, joista kukin vastaa omaan kysymykseensä. Valitse yksi lukeaksesi, mitä se etsii ja mitä se löysi.", "l1_t": "Kuka on taustalla", "l1_q": "Ovatko nämä erillisiä yrityksiä vai yksi toimija monella nimellä?", "l1_w": "Ryhmittelemme valtuutukset, joilla on sama verkkosivusto. Neljä sivustoa kantaa yksin 2 270 valtuutusta 3 322:sta.", "l1_s": "ICANNin oma julkinen luettelo valtuutetuista rekisterinpitäjistä.", "l1_r": "Ryväs ei sinänsä ole moitittava. Jälleenmyyjät ja yritysostot näyttävät ulospäin samalta. Se kertoo, missä yksi päätös yltää pisimmälle.", "l2_t": "Mitä he lupaavat", "l2_q": "Mainitsevatko yrityksen omat ehdot lainkaan lasten seksuaalista hyväksikäyttöä esittävää aineistoa?", "l2_w": "Luemme jokaisen rekisterinpitäjän julkaistut ehdot ja merkitsemme, esiintyvätkö sanat siellä, onko vain yleinen ilmaisu kuten laiton sisältö, vai eikö mitään.", "l2_s": "Rekisterinpitäjän omat julkaistut ehdot, haettuna ja lainattuna.", "l2_r": "Maininta ei ole todiste toiminnasta. Mainitsematta jättäminen tarkoittaa, ettei yritys ole kirjallisesti sitoutunut juuri siihen, mistä sitä arvioitaisiin.", "l3_t": "Mitä he näyttävät julkisesti", "l3_q": "Sopimuksen lisäksi: mitä yritys todella julkaisee, ja mitä ICANN on todennut?", "l3_w": "Kaksi erillistä pistemäärää, joita ei koskaan yhdistetä. Toinen siitä, minkä rekisterinpitäjä kertoo vapaaehtoisesti: väärinkäytösten yhteysosoite, reitti auttavaan puhelimeen, ilmaistu sitoumus, nimetyt luokat, viittaus EU-sääntelyyn. Toinen ICANNin virallisista rikkomusasioista.", "l3_s": "Rekisterinpitäjien omat tiedotussivut ja ICANNin julkiset valvontakirjeet.", "l3_r": "Vapaaehtoinen teko ja määrätty päätös ovat eri tyyppisiä tosiasioita, joihin liittyy eri vastineoikeus, joten ne pidetään erillään.", "l4_t": "Kuinka nopeasti he toimivat", "l4_q": "Kun pätevä ilmoitus on tehty, kauanko poistaminen todella kestää?", "l4_w": "Ei mitään. Tämä kerros on tyhjä, ja se puute on sivun tärkein asia.", "l4_s": "Mikään julkinen lähde ei kerro poistoaikaa tällä tasolla.", "l4_r": "Kaikki yllä mittaa sitä, mitä yritys sanoo. Tämä kerros mittaisi sitä, mitä se tekee. Ilman sitä indeksi ei vielä erota yritystä, joka jättää ilmoitukset huomiotta, siitä joka on hidas mutta toimii.", "l4_ask_h": "Mikä täyttäisi tämän kerroksen", "l4_ask": "Kolme asiaa keneltä tahansa, joka tekee ilmoituksia laajassa mitassa. Mitkä hosting-yritykset toistuvat. Mitkä rekisterinpitäjät toistuvat, mukaan lukien uudelleenrekisteröinti poiston jälkeen. Aika pätevästä ilmoituksesta poistoon, yrityksittäin, karkeina väleinä, ja käsitys siitä montako ilmoitusta kunkin takana on. Koostettu käy. Menneisyydestä käy. Karkea käy.", "l4_cta": "Jos teillä on jotain tästä, kirjoittakaa meille", "grades_h": "Näin arvosanaa luetaan", "grades_x": "Arvosana on kerroksen 3 avoimuuspistemäärä sadasta. Se mittaa sitä, mitä rekisterinpitäjä julkaisee, ei muuta.", "gA": "Julkaisee lähes kaiken, mitä etsimme", "gB": "Julkaisee suurimman osan", "gC": "Julkaisee osan", "gD": "Julkaisee vähän", "gF": "Julkaisee lähes ei mitään", "gN": "Ei arvioitu. Emme saaneet ehtoja haettua, joten johtopäätöstä ei ole kumpaankaan suuntaan. Ei koskaan lasketa nollaksi.", "table_h": "Kaikki indeksin rekisterinpitäjäsivustot", "search": "Hae yritystä tai sivustoa", "f_all": "Kaikki arvosanat", "f_csam": "Mainitsee hyväksikäyttöaineiston", "f_enf": "Valvonta-asia olemassa", "f_clu": "Jaetun sivuston ryppäässä", "showing": "näytetään", "of": "/", "col_site": "Sivusto", "col_names": "Yritykset", "col_acc": "Valtuutukset", "col_prom": "Mitä ehdot mainitsevat", "col_score": "Avoimuus", "col_enf": "ICANN-asiat", "p_named": "Mainitsee hyväksikäyttöaineiston", "p_child": "Mainitsee lastensuojelun, ei hyväksikäyttöaineistoa", "p_catch": "Vain yleinen ilmaisu", "p_none": "Ei mitään asiaan kuuluvaa", "p_unv": "Ei voitu lukea", "more": "Näytä lisää", "method_h": "Menetelmä, ja mitä se ei voi kertoa", "m1": "<b>Mistä ajankohdasta tiedot ovat.</b> Ehdot haettiin tiettynä päivänä ja luetaan uudelleen kuukausittain. Valvonta-asiat haetaan viikoittain. Molemmat päivämäärät ovat alla, koska vanhemman puoliskon lukeminen uutena olisi virhe.", "m2": "<b>Vahvistamaton ei ole nolla.</b> Jos emme saaneet asiakirjaa haettua, rekisterinpitäjää ei arvioida. Puuttuva pistemäärä on aukko meidän ulottuvuudessamme, ei päätelmä yrityksestä.", "m3": "<b>Laskutapa.</b> Luvut esitetään sivustoa tai verkkotunnusta kohden, ei koskaan valtuutusta kohden. Yksi toimija, jolla on satoja valtuutuksia, vääristäisi muuten jokaisen prosenttiluvun.", "m4": "<b>Valvonta-asioiden yhdistäminen.</b> ICANN yksilöi rekisterinpitäjän numerolla uudemmissa kirjeissä ja yrityksen nimellä vanhemmissa. Pelkkä nimiosuma ei koskaan riitä: jokainen vahvistetaan täydellistä juridista nimeä vasten ja merkitään päätellyksi, linkki alkuperäiseen kirjeeseen mukana.", "m5": "<b>Vastineoikeus.</b> Jos jokin tieto tää rum tölum", "s1": "leyfi til að selja lén", "s1x": "ICANN-heimildir. Eitt fyrirtæki getur haft margar þeirra, svo þetta er ekki fjöldi fyrirtækja.", "s2": "aðgreind vefsvæði skráningaraðila", "s2x": "Hvert leyfi vísar á vefsvæði fyrirtækis, og mörg leyfi vísa á það sama. Eitt og sér stendur namebright.com að baki 1.252 þeirra. Þannig verða 3.322 leyfi að um 1.007 aðilum, ekki fleirum.", "s3": "nefna efni um kynferðislegt ofbeldi gegn börnum", "s3x": "Af þeim 446 skilmálum sem við gátum lesið nefna svo margir það sérstaklega.", "s4": "miðgildi gagnsæis", "s4x": "Af 100. Helmingur metinna skráningaraðila er undir þessu.", "layers_h": "Svona er vísitalan byggð, lag fyrir lag", "layers_x": "Fjögur lög sem hvert svarar sinni spurningu. Veldu eitt til að lesa hvað það leitar að og hvað það fann.", "l1_t": "Hver stendur að baki", "l1_q": "Eru þetta aðskilin fyrirtæki, eða einn aðili með mörg nöfn?", "l1_w": "Við flokkum saman heimildir sem deila vefsvæði. Fjögur vefsvæði bera ein og sér 2.270 af 3.322 heimildum.", "l1_s": "Opinber listi ICANN yfir viðurkennda skráningaraðila.", "l1_r": "Þyrping er ekki í sjálfu sér ámælisverð. Endursöluaðilar og yfirtökur líta eins út að utan. Hún sýnir hvar ein ákvörðun nær lengst.", "l2_t": "Hverju þeir lofa", "l2_q": "Nefna skilmálar fyrirtækisins yfirhöfuð efni um kynferðislegt ofbeldi gegn börnum?", "l2_w": "Við lesum birta skilmála hvers skráningaraðila og skráum hvort orðin birtast, hvort aðeins stendur almennt orðalag eins og ólöglegt efni, eða hvort ekkert stendur.", "l2_s": "Birtir skilmálar skráningaraðilans sjálfs, sóttir og vitnað í.", "l2_r": "Að nefna það er ekki sönnun um aðgerð. Að nefna það ekki þýðir að fyrirtækið hefur ekki skuldbundið sig skriflega um einmitt það sem það yrði dæmt af.", "l3_t": "Hvað þeir sýna opinberlega", "l3_q": "Fyrir utan samninginn: hvað birtir fyrirtækið í raun, og hvað hefur ICANN fundið?", "l3_w": "Tvær aðskildar einkunnir, aldrei sameinaðar. Önnur fyrir það sem skráningaraðili gefur upp af fú , "f_clu": "Í þyrpingu með sameiginlegt vefsvæði", "showing": "sýnir", "of": "af", "col_site": "Vefsvæði", "col_names": "Fyrirtæki", "col_acc": "Heimildir", "col_prom": "Hvað skilmálarnir nefna", "col_score": "Gagnsæi", "col_enf": "ICANN-mál", "p_named": "Nefnir ofbeldisefni", "p_child": "Nefnir barnavernd, ekki ofbeldisefni", "p_catch": "Aðeins almennt orðalag", "p_none": "Ekkert sem á við", "p_unv": "Tókst ekki að lesa", "more": "Sýna fleiri", "method_h": "Aðferð, og hvað hún getur ekki sagt", "m1": "<b>Hvenær gögnin eru frá.</b> Skilmálar voru sóttir á einum degi og lesnir aftur mánaðarlega. Eftirlitsmál eru sótt vikulega. Báðar dagsetningar eru hér að neðan, því það væru mistök að lesa eldri helminginn eins og hann væri sá nýi.", "m2": "<b>Óstaðfest er ekki núll.</b> Ef okkur tókst ekki að sækja skjal er skráningaraðilinn ekki metinn. Einkunn sem vantar er gat í okkar færi, ekki niðurstaða um fyrirtækið.", "m3": "<b>Talning.</b> Tölur eru gefnar eftir vefsvæði eða léni, aldrei eftir heimild. Einn aðili með hundruð heimilda myndi annars skekkja hvert einasta hlutfall.", "m4": "<b>Tenging eftirlitsmála.</b> ICANN auðkennir skráningaraðila með númeri í nýrri bréfum og með nafni fyrirtækis í eldri. Nafnasamsvörun ein og sér nægir aldrei: hver og ein er staðfest gegn fullu lögheiti og merkt sem ályktuð, með tengli í upprunalega bréfið.", "m5": "<b>Andmælaréttur.</b> Sé eitthvað hér rangt eða úrelt, skrifið okkur. Við leiðréttum það og skráum að svo hafi verið gert.", "foot_ret": "Skilmálar sóttir", "foot_gen": "Eftirlitsmál uppfærð", "foot_lic": "Gefið út undir CC BY-ND 4.0. Tölurnar má endurgera úr heimildunum sem nefndar eru að ofan.", "note_review": "Þessi síða er í yfirlestri og er ekki opinber.", "lab_w": "Að hverju er leitað", "lab_s": "Hvaðan það kemur", "lab_r": "Hvernig á að lesa það", "det_quote": "Hvað skilmálarnir segja", "det_source": "Heimildaskjal", "det_doc": "Dagsetning skjals", "det_comp": "Hvað þeir birta", "first_1b": "<b>Tvennt ólíkt er talið.</b> Heimild er leyfi, gefið út af ICANN, til að selja lén. Vefsvæði er vefur fyrirtækisins sjálfs, sá sem leyfið vísar á. Eitt fyrirtæki getur haft mörg leyfi, svo leyfin eru fleiri en fyrirtækin, ekki öfugt. Fjögur vefsvæði standa ein og sér að baki 2.270 af 3.322."}};
const LANGS = ['en','da','nb','sv','fi','is'];
let L = 'en', DATA = null, shown = 60;

function t(k){ return (I18N[L] && I18N[L][k]) || I18N.en[k] || k; }
function nf(n){ return new Intl.NumberFormat(L === 'nb' ? 'nb-NO' : L).format(n); }

function buildLangs(){
  const el = document.getElementById('langs');
  el.innerHTML = LANGS.map(c =>
    `<button data-l="${c}" aria-pressed="${c===L}">${I18N[c].lang}</button>`).join('');
  el.querySelectorAll('button').forEach(b =>
    b.onclick = () => { setLang(b.dataset.l); });
}
function setLang(code){
  L = code;
  document.documentElement.lang = code === 'nb' ? 'no' : code;
  document.documentElement.dataset.lang = code;
  try { localStorage.setItem('rai_lang', code); } catch(e){}
  render();
}
function applyStrings(){
  document.querySelectorAll('[data-t]').forEach(n => n.innerHTML = t(n.dataset.t));
  document.querySelectorAll('[data-p]').forEach(n => n.placeholder = t(n.dataset.p));
  document.title = t('title') + ' · Custorian';
}

/* ---- layers ---- */
const LAYERS = ['l1','l2','l3','l4'];
let activeLayer = 'l2';
function buildLayers(){
  document.getElementById('ltabs').innerHTML = LAYERS.map((k,i) =>
    `<button class="ltab" role="tab" data-k="${k}" aria-selected="${k===activeLayer}">
       <span class="num">0${i+1}</span><span class="t">${t(k+'_t')}</span><span class="q">${t(k+'_q')}</span>
     </button>`).join('');
  document.querySelectorAll('.ltab').forEach(b =>
    b.onclick = () => { activeLayer = b.dataset.k; buildLayers(); });
  const k = activeLayer;
  const ask = k === 'l4'
    ? `<div class="ask"><h4>${t('l4_ask_h')}</h4><p>${t('l4_ask')}</p>
       <a href="mailto:info@custorian.org?subject=Registrar%20Accountability%20Index">${t('l4_cta')} &rarr;</a></div>` : '';
  document.getElementById('lpanel').innerHTML =
    `<div class="lq">${t(k+'_q')}</div>
     <div class="lgrid">
       <div><h4>${t('lab_w')}</h4><p>${t(k+'_w')}</p></div>
       <div><h4>${t('lab_s')}</h4><p>${t(k+'_s')}</p></div>
       <div><h4>${t('lab_r')}</h4><p>${t(k+'_r')}</p></div>
     </div>${ask}`;
}

/* ---- grades ---- */
function buildGrades(){
  const rows = [['A','gA'],['B','gB'],['C','gC'],['D','gD'],['F','gF'],['—','gN']];
  document.getElementById('glist').innerHTML = rows.map(([g,k]) =>
    `<div class="g"><span class="pill p${g === '—' ? 'N' : g}">${g}</span><span class="d">${t(k)}</span></div>`).join('');
}

/* ---- table ---- */
function promise(s){
  if (s.c === 2) return ['p_named','pA'];
  if (s.c === 1) return ['p_child','pC'];
  if (s.c === 0) return ['p_catch','pD'];
  return ['p_unv','pN'];
}
function rows(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const g = document.getElementById('fg').value;
  const fc = document.getElementById('fc').checked;
  const fk = document.getElementById('fk').checked;
  return DATA.sites.filter(s => {
    if (q && !(s.h.toLowerCase().includes(q) || (s.n||[]).join(' ').toLowerCase().includes(q))) return false;
    if (g && s.d !== g) return false;
    if (fc && s.c !== 2) return false;
    if (fk && (s.g||1) < 2) return false;
    return true;
  });
}
function buildTable(){
  const all = rows(), list = all.slice(0, shown);
  document.getElementById('count').textContent = `${t('showing')} ${nf(list.length)} ${t('of')} ${nf(all.length)}`;
  document.getElementById('tb').innerHTML = list.map((s,i) => {
    const [pk,pc] = promise(s);
    const grade = s.d || '—';
    const sc = s.d ? `<div class="score"><span class="pill p${grade}">${grade}</span>
        <span class="bar"><i style="width:${s.s}%"></i></span>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${s.s}</span></div>`
      : `<span class="pill pN">${t('p_unv')}</span>`;
    return `<tr class="r" data-i="${i}">
      <td data-l="${t('col_site')}"><span class="host">${s.h}</span>${(s.g||1)>1?`<span class="badge">×${nf(s.g)}</span>`:''}
        <div class="co">${(s.n||[]).slice(0,2).join(' · ')}${(s.n||[]).length>2?' …':''}</div></td>
      <td data-l="${t('col_acc')}" style="font-family:var(--mono);font-size:13px">${nf(s.a)}</td>
      <td data-l="${t('col_prom')}"><span class="pill ${pc}">${t(pk)}</span></td>
      <td data-l="${t('col_score')}">${sc}</td></tr>`;
  }).join('');
  document.getElementById('more').style.display = all.length > shown ? '' : 'none';
  document.querySelectorAll('tr.r').forEach(tr => tr.onclick = () => toggle(tr, list[+tr.dataset.i]));
}
function toggle(tr, s){
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains('det')) { nx.remove(); return; }
  const d = document.createElement('tr');
  d.className = 'det';
  d.innerHTML = `<td colspan="4"><dl>
    ${s.q ? `<dt>${t('det_quote')}</dt><dd class="quote">&hellip;${s.q}&hellip;</dd>` : ''}
    ${s.u ? `<dt>${t('det_source')}</dt><dd><a href="${s.u}" target="_blank" rel="noopener">${s.u}</a></dd>` : ''}
    ${s.v ? `<dt>${t('det_doc')}</dt><dd>${s.v}</dd>` : ''}
    ${(s.k||[]).length ? `<dt>${t('det_comp')}</dt><dd>${s.k.join(' · ')}</dd>` : ''}
    <dt>${t('col_names')}</dt><dd>${(s.n||[]).join(' · ') || '—'}</dd></dl></td>`;
  tr.after(d);
}

function render(){
  applyStrings(); buildLangs(); buildLayers(); buildGrades();
  const sel = document.getElementById('fg');
  const cur = sel.value;
  sel.innerHTML = `<option value="">${t('f_all')}</option>` + ['A','B','C','D','F'].map(g=>`<option value="${g}">${g}</option>`).join('');
  sel.value = cur;
  if (DATA) buildTable();
}

fetch('registrar-index.json').then(r=>r.json()).then(d => {
  DATA = d;
  const S = d.summary;
  document.getElementById('n1').textContent = nf(S.accreditations);
  document.getElementById('n2').textContent = nf(S.websites);
  document.getElementById('n3').textContent = nf(S.l2.named);
  document.getElementById('n4').textContent = S.l3.median;
  document.getElementById('dret').textContent = S.retrieved;
  document.getElementById('dgen').textContent = S.generated;
  buildTable();
});

['q','fg','fc','fk'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => { shown = 60; buildTable(); }));
document.getElementById('more').onclick = () => { shown += 60; buildTable(); };

try { const s = localStorage.getItem('rai_lang'); if (s && LANGS.includes(s)) L = s; } catch(e){}
render();
</script>
</body></html>
